name: atlas-d1-bootstrap

on:
  push:
    branches: [main]
    paths:
      - "schema.sql"
      - "schema-m2.sql"
      - "schema-m3.sql"
      - "schema-m4.sql"
      - "schema-m5.sql"
      - ".github/workflows/atlas-d1-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-d1-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Resolve Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          # Cloudflare account ID verified from the user's Cloudflare account dashboard URL.
          # It is an identifier, not a credential; keeping it as a source constant avoids
          # silently using an incorrect GitHub secret value.
          ACCOUNT_ID="c46718094ced1f5f75492f4c67c7d390"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "Using verified Cloudflare account ID for atlas_db."

      - name: Inspect D1 before schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 info atlas_db --json

      - name: Apply M1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute atlas_db --remote --yes --file=schema.sql

      - name: Apply M2 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute atlas_db --remote --yes --file=schema-m2.sql

      - name: Apply M3 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute atlas_db --remote --yes --file=schema-m3.sql

      - name: Apply M4 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute atlas_db --remote --yes --file=schema-m4.sql
          node <<'NODE'
          const { execFileSync } = require('child_process');
          const env = process.env;
          const run = (args) => execFileSync('npx', ['wrangler', ...args], { env, encoding: 'utf8', stdio: ['ignore','pipe','pipe'] });
          const required = [
            ['qa_status','TEXT'],['qa_report','TEXT'],['payment_status','TEXT'],
            ['amount_paid','REAL'],['price_source','TEXT'],['expected_amount','REAL'],
            ['file_name','TEXT'],['file_ext','TEXT'],['rows_in','INTEGER'],['rows_out','INTEGER'],
            ['delivery_channel','TEXT'],['delivery_status','TEXT']
          ];
          for (const [name,type] of required) {
            const ident = '"' + name.replaceAll('"','""') + '"';
            try {
              run(['d1','execute','atlas_db','--remote','--yes','--command',`ALTER TABLE order_ledger ADD COLUMN ${ident} ${type}`]);
              console.log('Ensured M4 column:', name);
            } catch (e) {
              const msg = String(e.stderr || e.stdout || e.message || '');
              if (/duplicate column name/i.test(msg)) {
                console.log('M4 column already exists:', name);
              } else {
                throw e;
              }
            }
          }

      - name: Apply M5 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute atlas_db --remote --yes --file=schema-m5.sql

      - name: Verify D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute atlas_db --remote --yes --command="SELECT name, type FROM sqlite_master WHERE type IN ('table','index') ORDER BY type, name;"
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA table_info(execution_state);"
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA table_info(delivery_outbox);"
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA table_info(order_ledger);"
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA index_list('execution_state');"
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA index_list('delivery_outbox');"
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA index_list('order_ledger');"

      - name: Verify deployed Worker health
        run: curl --fail --silent --show-error https://atlas-worker.hosamhosaam5.workers.dev/health

# Triggered after CLOUDFLARE_API_TOKEN repository secret setup.
# Deterministic bootstrap trigger: 2026-10-01T13:05+03:00
# M4 bootstrap hardening: conditionally add missing ledger columns before verification.
