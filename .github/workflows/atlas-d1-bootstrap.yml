name: atlas-d1-bootstrap

on:
  push:
    branches: [main]
    paths:
      - "schema.sql"
      - "schema-m2.sql"
      - "schema-m3.sql"
      - "schema-m4.sql"
      - "schema-m5.sql"
      - ".github/workflows/atlas-d1-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-d1-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler whoami --json > /tmp/whoami.json
          node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/whoami.json','utf8'));
          const found = [];
          function walk(v, path='') {
            if (!v || typeof v !== 'object') return;
            if (Array.isArray(v)) return v.forEach((x,i)=>walk(x,path+'['+i+']'));
            for (const [k,val] of Object.entries(v)) {
              if (k === 'id' && typeof val === 'string' && /^[a-f0-9]{32}$/i.test(val)) found.push(val);
              walk(val, path ? path+'.'+k : k);
            }
          }
          walk(x);
          const id = found[0];
          if (!id) {
            console.error('Could not resolve a 32-hex Cloudflare account ID from wrangler whoami.');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, 'CLOUDFLARE_ACCOUNT_ID='+id+'\\n');
          console.log('Resolved Cloudflare account ID.');
          NODE

      - name: Inspect D1 before schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 info atlas_db --json

      - name: Apply M1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute atlas_db --remote --yes --file=schema.sql

      - name: Apply M2 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute atlas_db --remote --yes --file=schema-m2.sql

      - name: Apply M3 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute atlas_db --remote --yes --file=schema-m3.sql

      - name: Apply M4 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute atlas_db --remote --yes --file=schema-m4.sql

      - name: Apply M5 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute atlas_db --remote --yes --file=schema-m5.sql

      - name: Verify D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute atlas_db --remote --yes --command="SELECT name, type FROM sqlite_master WHERE type IN ('table','index') ORDER BY type, name;"
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA table_info(execution_state);"
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA table_info(delivery_outbox);"
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA table_info(order_ledger);"
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA index_list('execution_state');"
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA index_list('delivery_outbox');"
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA index_list('order_ledger');"

      - name: Verify deployed Worker health
        run: curl --fail --silent --show-error https://atlas-worker.hosamhosaam5.workers.dev/health
