name: Delete isolated data-cleaning trial resources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/triggers/trial-cleanup.trigger"

permissions:
  contents: read

concurrency:
  group: atlas-data-cleaning-trial
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Check one-shot deletion marker
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          marker="$(tr -d '\r\n' < ops/triggers/trial-cleanup.trigger)"
          if [ "$marker" = "DELETE" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
            echo "ARMED | deletion of allowlisted trial resources only"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "SKIP | trial cleanup marker is disarmed"
          fi

      - name: Remove only the allowlisted trial Queue, Worker, and Durable Object namespaces
        if: steps.gate.outputs.armed == 'true'
        env:
          CF_TRIAL_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CF_ACCOUNT_ID: c46718094ced1f5f75492f4c67c7d390
        shell: bash
        run: |
          set +x
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const token = process.env.CF_TRIAL_API_TOKEN;
          const account = process.env.CF_ACCOUNT_ID;
          if (!token) { console.log('FAIL | CF_TRIAL_API_TOKEN'); process.exit(1); }
          const api = 'https://api.cloudflare.com/client/v4';
          const headers = { authorization: 'Bearer ' + token, 'content-type': 'application/json' };
          const workerName = 'atlas-data-cleaning-trial';
          const queueName = 'atlas-data-cleaning-trial-queue';
          const allowedClasses = new Set(['JobState', 'RateLimitState']);
          async function request(method, path) {
            const response = await fetch(api + path, { method, headers });
            const raw = await response.text();
            let body = {};
            try { body = raw ? JSON.parse(raw) : {}; } catch { body = {}; }
            if (!response.ok || body.success === false) {
              const permission = path.includes('/queues') ? 'Queues Write/Read' : 'Workers Scripts Write/Read';
              const detail = (body.errors || []).map(x => x.message).filter(Boolean).join('; ');
              console.log('FAIL | ' + (response.status === 403 ? permission : 'Cloudflare cleanup API (HTTP ' + response.status + ')') + (detail ? ' | ' + detail : ''));
              process.exit(1);
            }
            return body.result;
          }
          const scripts = await request('GET', '/accounts/' + account + '/workers/scripts');
          const queues = await request('GET', '/accounts/' + account + '/queues');
          const namespaces = await request('GET', '/accounts/' + account + '/workers/durable_objects/namespaces?per_page=1000');
          const workerExists = (scripts || []).some(x => [x.id, x.name, x.script_name].includes(workerName));
          const queue = (queues || []).find(x => x.queue_name === queueName);
          const targetNamespaces = (namespaces || []).filter(x => x.script === workerName);
          const unexpectedNamespaces = targetNamespaces.filter(x => !allowedClasses.has(x.class));
          if (unexpectedNamespaces.length) {
            console.log('FAIL | unexpected trial Worker Durable Object class found; preserving Worker and Queue');
            process.exit(1);
          }
          if (targetNamespaces.length && !workerExists) {
            console.log('FAIL | trial Durable Object namespace exists without its Worker script; preserving resources for manual reconciliation');
            process.exit(1);
          }
          if (queue) {
            const detail = await request('GET', '/accounts/' + account + '/queues/' + queue.queue_id);
            const consumers = detail?.consumers || [];
            const unexpectedConsumers = consumers.filter(x => x.type !== 'worker' || (x.script_name ?? x.script) !== workerName);
            if (unexpectedConsumers.length) {
              console.log('FAIL | unexpected Queue consumer found; preserving Queue and Worker');
              process.exit(1);
            }
            if (consumers.some(x => !x.consumer_id)) {
              console.log('FAIL | trial Queue consumer ID missing; preserving Queue and Worker');
              process.exit(1);
            }
            for (const consumer of consumers) {
              await request('DELETE', '/accounts/' + account + '/queues/' + queue.queue_id + '/consumers/' + consumer.consumer_id);
            }
            console.log('PASS | trial Queue consumers detached');
          }
          if (targetNamespaces.length) {
            const deletedClasses = [...new Set(targetNamespaces.map(x => x.class))].sort();
            mkdirSync('.atlas-trial-cleanup', { recursive: true });
            writeFileSync('.atlas-trial-cleanup/worker.js', 'export default { fetch() { return new Response("Not Found", { status: 404 }); } };\n');
            const migrationConfig = [
              'name = "' + workerName + '"',
              'main = "worker.js"',
              'compatibility_date = "2026-10-26"',
              'workers_dev = true',
              'preview_urls = false',
              '',
              '',
              '[[migrations]]',
              'tag = "trial-v1"',
              'new_sqlite_classes = [ "JobState", "RateLimitState" ]',
              '',
              '[[migrations]]',
              'tag = "trial-cleanup-v2"',
              'deleted_classes = [ ' + deletedClasses.map(x => JSON.stringify(x)).join(', ') + ' ]',
              '',
            ].join('\n');
            writeFileSync('.atlas-trial-cleanup/wrangler.toml', migrationConfig);
            const deployed = spawnSync('npx', ['--yes', 'wrangler@4', 'deploy', '--config', '.atlas-trial-cleanup/wrangler.toml'], {
              encoding: 'utf8',
              maxBuffer: 10 * 1024 * 1024,
              env: { ...process.env, CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account },
            });
            if (deployed.error || deployed.status !== 0) {
              const rawDetail = [deployed.stderr, deployed.stdout, deployed.error?.message].filter(Boolean).join('\n');
              const detail = rawDetail.split('\n').filter(x => /error|fail|migration|durable|permission|denied/i.test(x)).slice(-8).join(' | ').replaceAll(token, '[redacted]');
              console.log('FAIL | Durable Object deleted_classes migration' + (detail ? ' | ' + detail : ''));
              process.exit(1);
            }
            const namespacesAfterMigration = await request('GET', '/accounts/' + account + '/workers/durable_objects/namespaces?per_page=1000');
            const doRemaining = (namespacesAfterMigration || []).filter(x => x.script === workerName && allowedClasses.has(x.class));
            if (doRemaining.length) {
              console.log('FAIL | trial Durable Object namespaces remain after deleted_classes migration; preserving Worker script');
              process.exit(1);
            }
            console.log('PASS | deleted_classes migration applied; trial Durable Object namespaces absent');
          } else {
            console.log('PASS | trial Durable Object namespaces already absent; no migration required');
          }
          if (workerExists) {
            await request('DELETE', '/accounts/' + account + '/workers/scripts/' + workerName);
            console.log('PASS | allowlisted trial Worker deleted after namespace verification');
          } else {
            console.log('PASS | trial Worker already absent');
          }
          if (queue) {
            await request('DELETE', '/accounts/' + account + '/queues/' + queue.queue_id);
            console.log('PASS | allowlisted trial Queue deleted');
          } else {
            console.log('PASS | trial Queue already absent');
          }
          const scriptsAfter = await request('GET', '/accounts/' + account + '/workers/scripts');
          const queuesAfter = await request('GET', '/accounts/' + account + '/queues');
          const namespacesAfter = await request('GET', '/accounts/' + account + '/workers/durable_objects/namespaces?per_page=1000');
          const workerRemaining = (scriptsAfter || []).some(x => [x.id, x.name, x.script_name].includes(workerName));
          const queueRemaining = (queuesAfter || []).some(x => x.queue_name === queueName);
          const doRemaining = (namespacesAfter || []).filter(x => x.script === workerName);
          if (workerRemaining) { console.log('FAIL | trial Worker still exists'); process.exit(1); }
          if (queueRemaining) { console.log('FAIL | trial Queue still exists'); process.exit(1); }
          if (doRemaining.length) { console.log('FAIL | trial Durable Object namespaces still exist'); process.exit(1); }
          console.log('PASS | read-after-delete verification: trial Worker absent; Queue absent; all Worker Durable Object namespaces absent');
          NODE
