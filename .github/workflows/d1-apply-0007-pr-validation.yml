name: ATLAS D1 apply migration 0007 PR validation

on:
  pull_request:
    paths:
      - '.github/workflows/d1-apply-0007.yml'
      - '.github/workflows/d1-apply-0007-pr-validation.yml'
      - 'ops/scripts/d1-apply-0007.mjs'
      - 'ops/triggers/apply-0007.trigger'
      - 'migrations/0007_demand_query_indexes.sql'
      - 'test/d1-apply-0007-static.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request commit
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate guarded helper syntax
        run: node --check ops/scripts/d1-apply-0007.mjs
      - name: Validate migration allowlist and helper invariants
        run: node --test test/d1-apply-0007-static.test.mjs
