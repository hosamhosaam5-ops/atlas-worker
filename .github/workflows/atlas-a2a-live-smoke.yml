name: ATLAS live A2A paused-offer guard probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/atlas-a2a-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-a2a-live-smoke
  cancel-in-progress: false

jobs:
  live-a2a-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live A2A rejects paid task creation while offer is paused
        env:
          A2A_URL: https://atlas-worker.hosamhosaam5.workers.dev/a2a
        run: |
          set -euo pipefail
          mkdir -p evidence
          TEST_ID="atlas-guard-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          jq -n --arg id "$TEST_ID" '{
            jsonrpc: "2.0",
            id: $id,
            method: "message/send",
            params: {
              message: {
                messageId: $id,
                role: "user",
                parts: [{
                  kind: "text",
                  text: "ATLAS live A2A guard probe only. Do not call tools, send messages, make purchases, or perform financial actions."
                }]
              }
            }
          }' > evidence/request.json

          code="$(curl --silent --show-error --max-time 20 -H 'content-type: application/json' -H 'accept: application/json' --data-binary @evidence/request.json -o evidence/response.json -w '%{http_code}' "$A2A_URL")"
          echo "A2A_POST_HTTP_STATUS=$code"
          cat evidence/response.json

          # The product is intentionally paused. A safe rejection is the expected result.
          test "$code" = "400"
          jq -e --arg id "$TEST_ID" '
            .jsonrpc == "2.0" and
            .id == $id and
            .error.code == -32001 and
            (.error.message | contains("offer is paused")) and
            (.error.message | contains("No task was created"))
          ' evidence/response.json >/dev/null
          test "$(jq -r 'has("result")' evidence/response.json)" = "false"
          echo "PASS: live A2A route reached; paused offer rejected execution; no task created."

      - name: Upload A2A guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-live-a2a-guard-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
