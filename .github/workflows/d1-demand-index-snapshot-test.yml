name: ATLAS D1 demand-index schema-only fixture test

on:
  pull_request:
    paths:
      - 'migrations/0007_demand_query_indexes.sql'
      - 'test/fixtures/d1-production-schema-2026-10-30.json'
      - 'test/demand-indexes-migration.test.mjs'
      - '.github/workflows/d1-demand-index-snapshot-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-d1-demand-index-schema-fixture
  cancel-in-progress: false

jobs:
  schema-only-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply migration twice to schema-only fixture and verify rollback invariance
        run: node --test test/demand-indexes-migration.test.mjs
