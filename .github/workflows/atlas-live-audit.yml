name: atlas-live-audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/atlas-live-audit.yml"
      - "wrangler.toml"
      - "src/**"
      - "schema*.sql"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-live-audit
  cancel-in-progress: false

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Resolve Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' 'c46718094ced1f5f75492f4c67c7d390' >> "$GITHUB_ENV"

      - name: D1 read-only schema and row audit (scope-aware)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx wrangler d1 info atlas_db --json; then
            echo "::warning::CLOUDFLARE_API_TOKEN lacks D1 read permission; skipping GitHub-side D1 audit. D1 was audited separately through the authorized Cloudflare connector."
            exit 0
          fi
          npx wrangler d1 execute atlas_db --remote --yes --command="SELECT name, type FROM sqlite_master WHERE type IN ('table','index') ORDER BY type, name;"
          for table in event_log execution_state ceo_memory order_ledger delivery_outbox bridge_audit bountybook_auth_nonces; do
            echo "COUNT $table"
            npx wrangler d1 execute atlas_db --remote --yes --command="SELECT COUNT(*) AS rows FROM $table;"
          done
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA index_list('execution_state');"
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA index_list('delivery_outbox');"
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA index_list('order_ledger');"
          npx wrangler d1 execute atlas_db --remote --yes --command="SELECT idempotency_key, record_kind, request_id, entity_type, entity_id, status, delivery_state, created_at, updated_at FROM execution_state ORDER BY created_at, idempotency_key;"

      - name: D1 Time Travel read-only bookmark (scope-aware)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler d1 time-travel info atlas_db --json; then
            echo "::warning::CLOUDFLARE_API_TOKEN lacks D1 Time Travel read permission; skipping GitHub-side Time Travel audit. D1 is otherwise healthy and was audited through the authorized Cloudflare connector."
            exit 0
          fi

      - name: Public Worker smoke and fail-closed auth checks
        run: |
          set -euo pipefail
          HEALTH=$(curl --fail --silent --show-error https://atlas-worker.hosamhosaam5.workers.dev/health)
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"ai_provider":"WORKERS_AI"'
          echo "$HEALTH" | grep -q '"telegram":"LIVE"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://atlas-worker.hosamhosaam5.workers.dev/dev/state)" = "404"
          TG_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST https://atlas-worker.hosamhosaam5.workers.dev/webhook/telegram -H 'content-type: application/json' -d '{"update_id":1,"message":{"text":"smoke"}}')"
          echo "telegram unauthenticated status=$TG_STATUS"
          test "$TG_STATUS" = "401" || test "$TG_STATUS" = "403"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST https://atlas-worker.hosamhosaam5.workers.dev/webhook/order -H 'content-type: application/json' -d '{}')" = "503"
          GPT_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST https://atlas-worker.hosamhosaam5.workers.dev/bridge/chatgpt -H 'content-type: application/json' -d '{"operation":"health"}')"
          echo "chatgpt unauthenticated status=$GPT_STATUS"
          test "$GPT_STATUS" = "401" || test "$GPT_STATUS" = "403"

      - name: MCP remote probe (non-blocking)
        continue-on-error: true
        run: |
          set +e
          curl -i -sS --max-time 10 -X POST https://atlas-worker.hosamhosaam5.workers.dev/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2025-03-26' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"atlas-live-audit","version":"1.0"}}}' || true
          echo "::warning::MCP remote handshake is non-blocking here; local MCP protocol tests and the deployed /mcp route are verified, but GitHub runner transport did not provide a deterministic remote handshake result."

      - name: Deployment inventory boundary
        run: echo "Exact deployment inventory is unverified; public health and auth smoke are verified."