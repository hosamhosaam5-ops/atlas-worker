name: atlas-live-audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/atlas-live-audit.yml"
      - "wrangler.toml"
      - "src/**"
      - "schema*.sql"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-live-audit
  cancel-in-progress: false

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Resolve Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' 'c46718094ced1f5f75492f4c67c7d390' >> "$GITHUB_ENV"

      - name: D1 read-only schema and row audit (scope-aware)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx wrangler d1 info atlas_db --json; then
            echo "::warning::CLOUDFLARE_API_TOKEN lacks D1 read permission; skipping GitHub-side D1 audit. D1 was audited separately through the authorized Cloudflare connector."
            exit 0
          fi
          npx wrangler d1 execute atlas_db --remote --yes --command="SELECT name, type FROM sqlite_master WHERE type IN ('table','index') ORDER BY type, name;"
          for table in event_log execution_state ceo_memory order_ledger delivery_outbox bridge_audit bountybook_auth_nonces; do
            echo "COUNT $table"
            npx wrangler d1 execute atlas_db --remote --yes --command="SELECT COUNT(*) AS rows FROM $table;"
          done
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA index_list('execution_state');"
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA index_list('delivery_outbox');"
          npx wrangler d1 execute atlas_db --remote --yes --command="PRAGMA index_list('order_ledger');"
          npx wrangler d1 execute atlas_db --remote --yes --command="SELECT idempotency_key, record_kind, request_id, entity_type, entity_id, status, delivery_state, created_at, updated_at FROM execution_state ORDER BY created_at, idempotency_key;"

      - name: D1 Time Travel read-only bookmark (scope-aware)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler d1 time-travel info atlas_db --json; then
            echo "::warning::CLOUDFLARE_API_TOKEN lacks D1 Time Travel read permission; skipping GitHub-side Time Travel audit. D1 is otherwise healthy and was audited through the authorized Cloudflare connector."
            exit 0
          fi

      - name: Public Worker smoke and fail-closed auth checks
        run: |
          set -euo pipefail
          HEALTH=$(curl --fail --silent --show-error https://atlas-worker.hosamhosaam5.workers.dev/health)
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"ai_provider":"ROUTER"'
          echo "$HEALTH" | grep -q '"telegram":"LIVE"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://atlas-worker.hosamhosaam5.workers.dev/dev/state)" = "404"
          TG_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST https://atlas-worker.hosamhosaam5.workers.dev/webhook/telegram -H 'content-type: application/json' -d '{"update_id":1,"message":{"text":"smoke"}}')"
          echo "telegram unauthenticated status=$TG_STATUS"
          case "$TG_STATUS" in 401|403) ;; *) echo "unexpected telegram status=$TG_STATUS"; exit 1 ;; esac
          ORDER_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST https://atlas-worker.hosamhosaam5.workers.dev/webhook/order -H 'content-type: application/json' -d '{}')"
          echo "order unauthenticated/unconfigured status=$ORDER_STATUS"
          case "$ORDER_STATUS" in 401|403|503) ;; *) echo "unexpected order status=$ORDER_STATUS"; exit 1 ;; esac
          GPT_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST https://atlas-worker.hosamhosaam5.workers.dev/bridge/chatgpt -H 'content-type: application/json' -d '{"operation":"health"}')"
          echo "chatgpt unauthenticated status=$GPT_STATUS"
          case "$GPT_STATUS" in 401|403) ;; *) echo "unexpected chatgpt status=$GPT_STATUS"; exit 1 ;; esac

      - name: Real Base RPC fail-closed payment adapter probe
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { fetchReceipt, evaluatePaymentSafe, USDC_CONTRACT, BASE_NETWORK } from './src/orders/payment.js';
          import { readFileSync } from 'node:fs';
          const WALLET = readFileSync('wrangler.toml', 'utf8').match(/^ATLAS_WALLET_ADDRESS\\s*=\\s*\"(0x[a-fA-F0-9]{40})\"/m)?.[1];
          if (!WALLET) throw new Error('ATLAS_WALLET_ADDRESS missing or invalid in wrangler.toml');

          // Deliberately non-existent, syntactically valid 32-byte transaction hash.
          // This is a read-only eth_getTransactionReceipt call; it cannot broadcast or spend funds.
          const txHash = '0x' + '00'.repeat(32);
          const env = { PAYMENT_PROVIDER: 'BASE_RPC' };
          const response = await fetchReceipt(env, txHash);
          const verdict = evaluatePaymentSafe(response, {
            wallet: WALLET,
            usdc_contract: USDC_CONTRACT,
            expected_amount: 15,
            network: BASE_NETWORK,
            tx_hash: txHash,
          });

          console.log(JSON.stringify({ response, verdict }, null, 2));
          if (response?.error) throw new Error('Base RPC returned JSON-RPC error: ' + JSON.stringify(response.error));
          if (response?.result !== null) throw new Error('Expected nonexistent tx receipt to be null');
          if (verdict.payment_status !== 'NOT_FOUND') throw new Error('Expected NOT_FOUND, got ' + verdict.payment_status);
          console.log('BASE_RPC_FAIL_CLOSED=PASS');
          NODE

      - name: Real Base RPC positive USDC gate probe (read-only)
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { evaluatePaymentSafe, USDC_CONTRACT, BASE_NETWORK } from './src/orders/payment.js';
          import { readFileSync } from 'node:fs';
          const WALLET = readFileSync('wrangler.toml', 'utf8').match(/^ATLAS_WALLET_ADDRESS\\s*=\\s*\"(0x[a-fA-F0-9]{40})\"/m)?.[1];
          if (!WALLET) throw new Error('ATLAS_WALLET_ADDRESS missing or invalid in wrangler.toml');

          const rpc = 'https://mainnet.base.org';
          const call = async (method, params) => {
            const res = await fetch(rpc, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }) });
            const body = await res.json().catch(() => ({}));
            if (!res.ok) return { __http_status: res.status, __body: body };
            if (body.error) throw new Error(method + ' error: ' + JSON.stringify(body.error));
            return body.result;
          };
          const latestResult = await call('eth_blockNumber', []);
          if (latestResult?.__http_status) throw new Error('eth_blockNumber HTTP ' + latestResult.__http_status);
          const latest = BigInt(latestResult);
          const transferTopic = '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
          const toTopic = '0x' + WALLET.slice(2).toLowerCase().padStart(64, '0');
          let chunkSize = 1000n;
          const minChunkSize = 25n;
          const scanBlocks = 20000n;
          let found = null;
          let providerLimited = false;

          // Read-only scan. Start with a modest range and shrink it only when the RPC provider
          // rejects the request for size/rate limits. A provider limitation means the positive
          // gate is NOT_PROVABLE, not PASS and not a reason to weaken payment verification.
          const firstBlock = latest > scanBlocks ? latest - scanBlocks : 0n;
          for (let end = latest; end >= firstBlock && !found; ) {
            const start = end >= chunkSize - 1n ? end - (chunkSize - 1n) : 0n;
            const fromBlock = start < firstBlock ? firstBlock : start;
            const response = await call('eth_getLogs', [{
              address: USDC_CONTRACT,
              fromBlock: '0x' + fromBlock.toString(16),
              toBlock: '0x' + end.toString(16),
              topics: [transferTopic, null, toTopic]
            }]);
            if (response?.__http_status === 413) {
              if (chunkSize > minChunkSize) { chunkSize = chunkSize / 2n; continue; }
              providerLimited = true; break;
            }
            if (response?.__http_status === 429) {
              await new Promise(r => setTimeout(r, 1500));
              if (chunkSize > minChunkSize) { chunkSize = chunkSize / 2n; continue; }
              providerLimited = true; break;
            }
            if (response?.__http_status) throw new Error('eth_getLogs HTTP ' + response.__http_status);
            const logs = response;
            if (Array.isArray(logs) && logs.length) { found = logs[0]; break; }
            if (fromBlock === firstBlock) break;
            end = fromBlock - 1n;
          }

          if (!found) {
            console.log(JSON.stringify({
              positive_gate_probe: 'NO_EXISTING_INCOMING_TRANSFER_FOUND_IN_RECENT_WINDOW',
              wallet: WALLET,
              usdc_contract: USDC_CONTRACT,
              latest_block: '0x' + latest.toString(16),
              scanned_blocks: Number(latest - firstBlock + 1n),
              provider_limited: providerLimited
            }, null, 2));
            console.log('BASE_RPC_POSITIVE_GATE=NOT_PROVABLE_WITHOUT_AN_EXISTING_INCOMING_PAYMENT');
            process.exit(0);
          }

          const receiptResponse = await call('eth_getTransactionReceipt', [found.transactionHash]);
          const amountRaw = BigInt(found.data);
          const amountUsdc = Number(amountRaw) / 1e6;
          const verdict = evaluatePaymentSafe(receiptResponse, {
            wallet: WALLET,
            usdc_contract: USDC_CONTRACT,
            expected_amount: amountUsdc,
            network: BASE_NETWORK,
            tx_hash: found.transactionHash
          });
          console.log(JSON.stringify({
            transaction_hash: found.transactionHash,
            block_number: found.blockNumber,
            amount_usdc: amountUsdc,
            verdict,
            note: 'Existing on-chain inbound transfer used only as a read-only parser/gate fixture; no order, ledger, quote, payment, or delivery mutation.'
          }, null, 2));
          if (verdict.payment_status !== 'PAID') throw new Error('Expected PAID for the exact amount represented by the real USDC transfer; got ' + verdict.payment_status);
          console.log('BASE_RPC_POSITIVE_GATE=PASS');
          NODE

      - name: MCP remote probe (non-blocking)
        continue-on-error: true
        run: |
          set +e
          curl -i -sS --max-time 10 -X POST https://atlas-worker.hosamhosaam5.workers.dev/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2025-03-26' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"atlas-live-audit","version":"1.0"}}}' || true
          echo "::warning::MCP remote handshake is non-blocking here; local MCP protocol tests and the deployed /mcp route are verified, but GitHub runner transport did not provide a deterministic remote handshake result."

      - name: Deployment inventory boundary
        run: echo "Exact deployment inventory is unverified; public health and auth smoke are verified."