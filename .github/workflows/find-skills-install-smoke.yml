name: Find Skills CLI Install Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/find-skills-install-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: find-skills-install-smoke
  cancel-in-progress: true

jobs:
  install-find-skills:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up supported Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.20.0

      - name: Verify Node.js version
        run: |
          node --version
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 20)) process.exit(1)'

      - name: Install official find-skills with the Skills CLI
        run: npx --yes skills add https://github.com/vercel-labs/skills --skill find-skills -a codex -y

      - name: Verify installed skill is readable
        run: |
          npx --yes skills list
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          const paths = [
            ".agents/skills/find-skills/SKILL.md",
            ".codex/skills/find-skills/SKILL.md"
          ];
          const path = paths.find((candidate) => existsSync(candidate));
          if (!path) throw new Error("find-skills/SKILL.md was not created in a Codex-compatible project path");
          const contents = readFileSync(path, "utf8");
          if (!/^name:\s*find-skills\s*$/m.test(contents)) {
            throw new Error("Installed SKILL.md does not declare name: find-skills");
          }
          if (!contents.includes("How to Help Users Find Skills")) {
            throw new Error("Installed SKILL.md is missing expected guidance");
          }
          console.log(JSON.stringify({ result: "PASS", path, bytes: Buffer.byteLength(contents) }, null, 2));
          NODE
