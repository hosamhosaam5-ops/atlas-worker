name: atlas-registry-submit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/atlas-registry-submit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check existing public Registry entry before any submit
        id: precheck
        env:
          AGENT_URL: https://atlas-worker.hosamhosaam5.workers.dev/.well-known/agent-card.json
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error 'https://api.a2a-registry.org/public/agents?q=ATLAS' -o registry-precheck.json
          cat registry-precheck.json
          if grep -Fq "$AGENT_URL" registry-precheck.json; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            cp registry-precheck.json registry-browser-result.txt
            echo "Existing ATLAS Registry entry found; skipping Submit Agent to avoid duplicate registration."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Register ATLAS through the public Submit Agent flow
        id: browser
        if: steps.precheck.outputs.exists != 'true'
        env:
          AGENT_URL: https://atlas-worker.hosamhosaam5.workers.dev/.well-known/agent-card.json
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            let browser;
            let body = '';
            try {
              browser = await chromium.launch({headless:true});
              const page = await browser.newPage();
              page.on('console', m => console.log('[browser]', m.type(), m.text()));
              page.on('requestfailed', r => console.log('[requestfailed]', r.url(), r.failure()?.errorText || 'unknown'));
              await page.goto('https://www.a2a-registry.org/submit', {waitUntil:'domcontentloaded', timeout:60000});
              await page.waitForLoadState('networkidle', {timeout:30000}).catch(()=>{});
              console.log('submit_page=', page.url());
              console.log('title=', await page.title());
              const inputs = await page.locator('input').evaluateAll(els => els.map(e => ({type:e.type, name:e.name, placeholder:e.placeholder, aria:e.getAttribute('aria-label')})));
              console.log('inputs=', JSON.stringify(inputs));
              await page.locator('input').first().fill(process.env.AGENT_URL);
              console.log('buttons=', JSON.stringify(await page.locator('button').evaluateAll(els => els.map(e => (e.innerText || e.textContent || '').trim()))));
              await page.getByRole('button', {name:/scan agent/i}).click();
              await page.waitForTimeout(5000);
              await page.waitForLoadState('networkidle', {timeout:30000}).catch(()=>{});
              console.log('after_submit_url=', page.url());
              body = await page.locator('body').innerText();
              console.log('result_text=', body.slice(0,12000));
              if (/captcha|verify you are human|access denied/i.test(body)) throw new Error('Registry submission was blocked by anti-bot/human verification; no registration claim made.');
              if (!/registered|unclaimed|go live|success|agent id|package name/i.test(body)) throw new Error('Registry UI did not expose a registration success/Unclaimed result after Scan Agent.');
            } finally {
              fs.writeFileSync('registry-browser-result.txt', body.slice(0,30000));
              if (browser) await browser.close().catch(()=>{});
            }
          })().catch(() => process.exit(1));
          NODE
      - name: Persist browser attempt evidence
        if: always()
        env:
          AGENT_URL: https://atlas-worker.hosamhosaam5.workers.dev/.well-known/agent-card.json
        run: |
          set +e
          export STATUS="browser_step_failed"
          if [ -f registry-browser-result.txt ]; then export STATUS="browser_step_completed"; fi
          python3 - <<'PY' > .github/registry-attempt-result.json
import json, pathlib, os, datetime
p=pathlib.Path("registry-browser-result.txt")
body=p.read_text(errors="replace")[:30000] if p.exists() else ""
print(json.dumps({
  "attempted_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
  "workflow_run": os.environ.get("GITHUB_RUN_ID"),
  "status": os.environ.get("STATUS"),
  "agent_url": os.environ.get("AGENT_URL"),
  "body": body
}, ensure_ascii=False))
PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/registry-attempt-result.json registry-browser-result.txt
          git commit -m "chore: record ATLAS registry submission attempt" || true
          git push origin HEAD:main || true

      - name: Independently verify ATLAS appears in the public registry
        if: success()
        env:
          AGENT_URL: https://atlas-worker.hosamhosaam5.workers.dev/.well-known/agent-card.json
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             'https://api.a2a-registry.org/public/agents?q=ATLAS'             -o registry-search.json
          cat registry-search.json
          grep -Fq "$AGENT_URL" registry-search.json
          echo "ATLAS_PUBLIC_REGISTRY_VERIFIED=true"
