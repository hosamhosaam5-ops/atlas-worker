name: ATLAS D1 restore point

on:
  push:
    branches: [main]
    paths:
      - 'ops/triggers/restore-point.trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-d1-restore-point
  cancel-in-progress: false

jobs:
  restore-point:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked Wrangler dependency
        run: npm ci --no-audit --no-fund

      - name: Verify Cloudflare D1 token and database backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node ops/scripts/d1-restore-point-capture.mjs

      - name: Capture Time Travel bookmark and read-only baseline counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node ops/scripts/d1-restore-point-verify.mjs
          node --check ops/scripts/d1-restore-point-verify.mjs
          node --check ops/scripts/d1-restore-point-capture.mjs
          awk '
            /^- Bookmark: / { print; next }
            /^- demand_signals columns: / { print; next }
            /^- demand_signals rows: / { print; next }
            /^- (event_log|order_quotes|order_ledger|execution_state|ceo_memory|bridge_audit|zatca_experiment_requests|acquisition_assets|channel_watch|publications|bountybook_auth_nonces|order_files|delivery_outbox|demand_signals|demand_scan_source_runs|demand_source_health): / { print; next }
          ' "$GITHUB_STEP_SUMMARY"
