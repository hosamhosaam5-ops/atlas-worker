name: ATLAS isolated D1 commercial integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/atlas-isolated-d1-integration.yml"
      - "test/d1-integration-worker.mjs"
      - "src/orders/**"
      - "src/core/outbox.js"
      - "src/autonomy/registry.js"
      - "schema*.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-isolated-d1-commercial-integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c46718094ced1f5f75492f4c67c7d390
      TEST_DATABASE_NAME: atlas-integration-isolated-20261027
      TEST_DATABASE_ID: 7aadb3d6-0404-48ef-aadb-6526874b8ddd
    steps:
      - name: Checkout main commit
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Initialize isolated D1 and run the real Worker pipeline with MOCK adapters
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          WORKER_NAME="atlas-it-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TEST_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TEST_TOKEN"
          WORKER_URL="https://${WORKER_NAME}.hosamhosaam5.workers.dev"
          cat > wrangler.integration.toml <<EOF
          name = "${WORKER_NAME}"
          main = "test/d1-integration-worker.mjs"
          compatibility_date = "2026-09-27"
          compatibility_flags = ["global_fetch_strictly_public"]

          [[d1_databases]]
          binding = "DB"
          database_name = "${TEST_DATABASE_NAME}"
          database_id = "${TEST_DATABASE_ID}"

          [vars]
          PAYMENT_PROVIDER = "MOCK"
          PAYMENT_MOCK_SCENARIO = "valid"
          EMAIL_PROVIDER = "MOCK"
          EMAIL_MOCK_SCENARIO = "success"
          TELEGRAM_PROVIDER = "MOCK"
          FILE_STORAGE = "D1"

          [observability]
          enabled = true
          head_sampling_rate = 1.0

          [observability.logs]
          enabled = true
          invocation_logs = true
          EOF

          TAIL_PID=""
          cleanup() {
            set +e
            if [ -n "$TAIL_PID" ]; then kill "$TAIL_PID" >/dev/null 2>&1; wait "$TAIL_PID" >/dev/null 2>&1; fi
            curl --silent --show-error --max-time 20 -X DELETE \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" \
              -o worker-delete.json
            if [ -f worker-delete.json ]; then
              jq -e '.success == true' worker-delete.json >/dev/null 2>&1 || echo "::warning::Temporary integration Worker cleanup needs review."
            fi
          }
          trap cleanup EXIT

          for schema in schema.sql schema-m2.sql schema-m3.sql schema-m5.sql; do
            echo "Applying ${schema} to isolated D1 only"
            npx --no-install wrangler d1 execute "$TEST_DATABASE_NAME" --remote --yes --file="$schema" --config wrangler.integration.toml
          done

          npx --no-install wrangler deploy --config wrangler.integration.toml --var "TEST_TOKEN:${TEST_TOKEN}"
          npx --no-install wrangler tail "$WORKER_NAME" --format pretty > worker-tail.log 2>&1 &
          TAIL_PID=$!
          sleep 3
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 10 "$WORKER_URL/health" -o health.json; then
              jq -e '.ok == true and .service == "atlas-isolated-d1-test-worker"' health.json
              break
            fi
            if [ "$attempt" = "15" ]; then
              echo "::error::Temporary test Worker health never became ready."
              exit 1
            fi
            sleep 2
          done

          status="$(curl --silent --show-error --max-time 60 -o integration.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TEST_TOKEN}" \
            -H 'content-type: application/json' \
            --data "{\"run_id\":${GITHUB_RUN_ID}}" "$WORKER_URL/run")"
          echo "Isolated D1 integration HTTP=${status}"
          cat integration.json
          test "$status" = "200"
          jq -e '.ok == true and (.assertions | length >= 7) and all(.assertions[]; .passed == true)' integration.json
          kill "$TAIL_PID" >/dev/null 2>&1 || true
          wait "$TAIL_PID" >/dev/null 2>&1 || true
          TAIL_PID=""
          cat worker-tail.log
      - name: Upload isolated D1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-isolated-d1-integration-${{ github.run_id }}
          path: |
            health.json
            integration.json
            worker-delete.json
            worker-tail.log
            wrangler.integration.toml
          if-no-files-found: warn
