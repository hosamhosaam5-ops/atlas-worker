name: ATLAS Clean v1 production deployment

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Must be exactly https://atlas-clean-v1.hosamhosaam5.workers.dev; required only for deploy mode."
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "ops/triggers/clean-v1-production.trigger"

permissions:
  contents: read

concurrency:
  group: atlas-clean-v1-production
  cancel-in-progress: false

jobs:
  resolve-trigger:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Resolve exact production marker
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const raw = readFileSync('ops/triggers/clean-v1-production.trigger', 'utf8').replace(/\r\n/g, '\n');
          const content = raw.endsWith('\n') ? raw.slice(0, -1) : raw;
          const lines = content.split('\n');
          let mode = 'skip';
          if (lines.length === 1 && lines[0] === 'PREFLIGHT') {
            mode = 'preflight';
          } else if (
            lines.length === 3 &&
            lines[0] === 'RUN' &&
            lines[1] === 'OWNER_CONFIRMED_CLEAN_V1_WALLET' &&
            lines[2] === ''
          ) {
            mode = 'deploy';
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'mode=' + mode + '\n');
          if (mode === 'preflight') {
            console.log('MARKER_MODE=PREFLIGHT | read-only preflight only');
          } else if (mode === 'deploy') {
            console.log('MARKER_MODE=RUN | owner confirmation matched; preflight must pass before deploy');
          } else {
            console.log('MARKER_MODE=SKIP | marker content is not an exact approved value; no Cloudflare action');
          }
          NODE

  read-only-preflight:
    needs: resolve-trigger
    if: github.ref == 'refs/heads/main' && (needs.resolve-trigger.outputs.mode == 'preflight' || needs.resolve-trigger.outputs.mode == 'deploy')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Verify existing CF_TRIAL_API_TOKEN with read-only requests only
        env:
          CF_TRIAL_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CF_ACCOUNT_ID: "c46718094ced1f5f75492f4c67c7d390"
        run: node ops/scripts/clean-v1-production-preflight.mjs

  deploy:
    needs: [resolve-trigger, read-only-preflight]
    if: github.ref == 'refs/heads/main' && needs.resolve-trigger.outputs.mode == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Validate isolated target configuration and immutable scope
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = readFileSync('wrangler.clean-v1.toml', 'utf8');
          const worker = readFileSync('src/clean-v1/worker.js', 'utf8');
          if (!/^name = "atlas-clean-v1"$/m.test(config)) throw new Error('unexpected Worker name');
          if (!/^main = "src\/clean-v1\/worker.js"$/m.test(config)) throw new Error('unexpected Worker entrypoint');
          if (!/^workers_dev = true$/m.test(config)) throw new Error('workers_dev must be true (the only public URL is workers.dev)');
          if (!/^preview_urls = false$/m.test(config)) throw new Error('preview_urls must remain false');
          if (/d1_databases|atlas_db|routes\s*=|custom_domains/i.test(config)) throw new Error('forbidden binding or route configuration found');
          if (!worker.includes("service: 'atlas-clean-v1'")) throw new Error('unexpected service identity');
          console.log('DEPLOY_TARGET_CONFIG=PASS | atlas-clean-v1 / src/clean-v1/worker.js only');
          console.log('MAIN_WORKER_CONFIG_TOUCHED=false');
          console.log('D1_OR_ATLAS_DB_BINDINGS=false');
          console.log('ROUTE_CHANGES=false | no zone route or custom domain; workers.dev only');
          NODE

      - name: Validate the owner-provided workers.dev base URL
        id: route
        env:
          CLEAN_V1_PROD_BASE_URL: ${{ inputs.base_url || vars.CLEAN_V1_PROD_BASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const raw = process.env.CLEAN_V1_PROD_BASE_URL || '';
          let url;
          try { url = new URL(raw); } catch { throw new Error('CLEAN_V1_PROD_BASE_URL is required and must be a valid HTTPS URL'); }
          if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash) {
            throw new Error('CLEAN_V1_PROD_BASE_URL must be HTTPS without credentials, query, or fragment');
          }
          const base = url.toString().replace(/\/+$/, '');
          const expected = 'https://atlas-clean-v1.hosamhosaam5.workers.dev';
          if (base !== expected) throw new Error('CLEAN_V1_PROD_BASE_URL must be exactly ' + expected);
          appendFileSync(process.env.GITHUB_ENV, 'CLEAN_V1_PROD_BASE_URL=' + base + '\n');
          console.log('PRODUCTION_BASE_URL_VALID=PASS');
          console.log('ROUTE_PROVISIONING=WORKERS_DEV | enabled by workers_dev = true on deploy; no zone route');
          NODE

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run full local test suite
        run: npm test

      - name: Capture pre-deployment version inventory (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "c46718094ced1f5f75492f4c67c7d390"
        shell: bash
        run: |
          set +e
          npx --no-install wrangler deployments list --name atlas-clean-v1 --json --config wrangler.clean-v1.toml > clean-v1-deployments-before.json 2> clean-v1-deployments-before.err
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "PREDEPLOY_VERSION_INVENTORY=CAPTURED"
            cat clean-v1-deployments-before.json
          else
            echo "PREDEPLOY_VERSION_INVENTORY=UNKNOWN | target may not exist or token may lack Workers metadata read"
          fi

      - name: Validate production bundle without deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "c46718094ced1f5f75492f4c67c7d390"
        run: npx --no-install wrangler deploy --dry-run --config wrangler.clean-v1.toml

      - name: Deploy only atlas-clean-v1 using its dedicated Wrangler config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "c46718094ced1f5f75492f4c67c7d390"
        run: npx --no-install wrangler deploy --config wrangler.clean-v1.toml

      - name: Read back active deployment version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "c46718094ced1f5f75492f4c67c7d390"
        run: npx --no-install wrangler deployments status --name atlas-clean-v1 --json --config wrangler.clean-v1.toml

      - name: Mark start of read-only measurement window
        shell: bash
        run: echo "CLEAN_V1_METRICS_START=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Verify GET preview, 10-row and 200-row POST preview, and unpaid 402
        run: node ops/scripts/clean-v1-production-probe.mjs

      - name: Wait five minutes for Analytics aggregation
        run: sleep 300

      - name: Read CPU quantile unit and invocation status counters
        env:
          CF_TRIAL_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CF_ACCOUNT_ID: "c46718094ced1f5f75492f4c67c7d390"
        run: node ops/scripts/clean-v1-production-analytics.mjs
