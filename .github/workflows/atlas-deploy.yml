name: atlas-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atlas-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.toml

  missing-credential:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "CLOUDFLARE_API_TOKEN is not configured; deployment intentionally not attempted."
          exit 1
