name: ATLAS tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete test suite
        run: npm test

  registry_submit:
    # Never submit or mutate the external Registry from pull-request validation.
    # Keep this integration limited to the canonical main branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check existing public Registry entry before any submit
        id: precheck
        env:
          AGENT_URL: https://atlas-worker.hosamhosaam5.workers.dev/.well-known/agent-card.json
        run: |
          set -euo pipefail
          set +e
          status="$(curl --silent --show-error --max-time 20 -o registry-precheck.json -w '%{http_code}' 'https://api.a2a-registry.org/public/agents?q=ATLAS')"
          curl_rc=$?
          set -e
          if [ "$curl_rc" -ne 0 ]; then
            echo "::warning::A2A Registry precheck transport failed; no registry mutation will be attempted."
            echo "authenticated=false" >> "$GITHUB_OUTPUT"
            echo "exists=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "::warning::A2A Registry API requires authorization ($status); safely skipping all registry writes and verification."
            echo "authenticated=false" >> "$GITHUB_OUTPUT"
            echo "exists=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "A2A Registry precheck returned unexpected HTTP $status." >&2
            cat registry-precheck.json >&2 || true
            exit 1
          fi
          echo "authenticated=true" >> "$GITHUB_OUTPUT"
          cat registry-precheck.json
          if grep -Fq "$AGENT_URL" registry-precheck.json; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ATLAS registry entry already exists; skipping Submit Agent to avoid duplicates."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Register ATLAS through Submit Agent
        if: steps.precheck.outputs.authenticated == 'true' && steps.precheck.outputs.exists == 'false'
        env:
          AGENT_URL: https://atlas-worker.hosamhosaam5.workers.dev/.well-known/agent-card.json
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            let browser;
            let body = '';
            try {
              browser = await chromium.launch({headless:true});
              const page = await browser.newPage();
              page.on('requestfailed', r => console.log('[requestfailed]', r.url(), r.failure()?.errorText || 'unknown'));
              await page.goto('https://www.a2a-registry.org/submit', {waitUntil:'domcontentloaded', timeout:60000});
              await page.waitForLoadState('networkidle', {timeout:30000}).catch(()=>{});
              console.log('submit_page=', page.url());
              console.log('title=', await page.title());
              console.log('inputs=', JSON.stringify(await page.locator('input').evaluateAll(els => els.map(e => ({type:e.type,name:e.name,placeholder:e.placeholder,aria:e.getAttribute('aria-label')}))));
              await page.locator('input').first().fill(process.env.AGENT_URL);
              console.log('buttons=', JSON.stringify(await page.locator('button').evaluateAll(els => els.map(e => (e.innerText || e.textContent || '').trim()))));
              await page.getByRole('button', {name:/scan agent/i}).click();
              await page.waitForTimeout(5000);
              await page.waitForLoadState('networkidle', {timeout:30000}).catch(()=>{});
              console.log('preview_url=', page.url());
              body = await page.locator('body').innerText();
              console.log('preview_text=', body.slice(0,20000));
              if (/captcha|verify you are human|access denied/i.test(body)) throw new Error('ANTI_BOT_OR_ACCESS_BLOCK');
              await page.locator('button').last().click();
              await page.waitForTimeout(7000);
              await page.waitForLoadState('networkidle', {timeout:30000}).catch(()=>{});
              console.log('final_url=', page.url());
              body = await page.locator('body').innerText();
              console.log('final_text=', body.slice(0,30000));
              fs.writeFileSync('registry-browser-result.txt', body.slice(0,30000));
              if (/captcha|verify you are human|access denied/i.test(body)) throw new Error('ANTI_BOT_OR_ACCESS_BLOCK');
              if (!/ATLAS|successfully|agent id|package name|unclaimed/i.test(body)) throw new Error('NO_SUCCESS_SIGNAL');
            } finally {
              if (!fs.existsSync('registry-browser-result.txt')) fs.writeFileSync('registry-browser-result.txt', body.slice(0,30000));
              if (browser) await browser.close().catch(()=>{});
            }
          })().catch(err => { console.error(err.stack || String(err)); throw err; });
          NODE

      - name: Verify public registry independently
        if: success() && steps.precheck.outputs.authenticated == 'true'
        env:
          AGENT_URL: https://atlas-worker.hosamhosaam5.workers.dev/.well-known/agent-card.json
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error 'https://api.a2a-registry.org/public/agents?q=ATLAS' -o registry-search.json
          cat registry-search.json
          grep -Fq "$AGENT_URL" registry-search.json
      - name: Monitor existing Registry metadata after deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.precheck.outputs.authenticated == 'true'
        env:
          AGENT_URL: https://atlas-worker.hosamhosaam5.workers.dev/.well-known/agent-card.json
        run: |
          set -euo pipefail
          BASE='https://atlas-worker.hosamhosaam5.workers.dev'
          # The deploy workflow is path-filtered. For test-only commits, compare
          # against the latest commit that can actually change the deployed Worker.
          expected_sha="$(git log -1 --format=%H -- src wrangler.toml package.json package-lock.json 'schema*.sql' migrations .github/workflows/atlas-worker-deploy.yml)"
          test -n "$expected_sha"
          actual_sha=""
          for attempt in $(seq 1 60); do
            health_json="$(curl --fail --silent --show-error --max-time 10 "$BASE/health" || true)"
            actual_sha="$(printf '%s' "$health_json" | jq -r '.git_sha // ""' 2>/dev/null || true)"
            if [ "$actual_sha" = "$expected_sha" ]; then
              echo "POST_DEPLOY_SOURCE_SHA=$actual_sha"
              break
            fi
            echo "Waiting for deployed Worker before checking Registry freshness: expected=$expected_sha actual=${actual_sha:-missing} attempt=$attempt"
            sleep 2
          done
          test "$actual_sha" = "$expected_sha"
          curl --fail-with-body --silent --show-error "$AGENT_URL" -o deployed-agent-card.json
          curl --fail-with-body --silent --show-error 'https://api.a2a-registry.org/public/agents?q=ATLAS' -o registry-after-deploy.json
          jq -e --arg url "$AGENT_URL" 'any(.agents[]; .manifestUrl==$url and .status=="ACTIVE")' registry-after-deploy.json
          deployed_description="$(jq -r '.description // ""' deployed-agent-card.json)"
          registry_description="$(jq -r --arg url "$AGENT_URL" '.agents[] | select(.manifestUrl==$url and .status=="ACTIVE") | .source_agent_card | fromjson | .description // ""' registry-after-deploy.json)"
          deployed_push="$(jq -r '.capabilities.pushNotifications // false' deployed-agent-card.json)"
          registry_push="$(jq -r --arg url "$AGENT_URL" '.agents[] | select(.manifestUrl==$url and .status=="ACTIVE") | .source_agent_card | fromjson | .capabilities.pushNotifications // false' registry-after-deploy.json)"
          if [ "$deployed_description" = "$registry_description" ] && [ "$deployed_push" = "$registry_push" ]; then
            printf 'REGISTRY_METADATA_FRESH=PASS\nsource_sha=%s\nlisting_status=ACTIVE\n' "$actual_sha" | tee registry-freshness.txt
          else
            {
              echo 'REGISTRY_METADATA_FRESH=STALE'
              echo "source_sha=$actual_sha"
              echo 'listing_status=ACTIVE'
              echo "deployed_description=$deployed_description"
              echo "registry_description=$registry_description"
              echo "deployed_pushNotifications=$deployed_push"
              echo "registry_pushNotifications=$registry_push"
              echo 'action=No new listing submitted; refresh of the existing entry requires Registry-supported owner action or automatic re-indexing.'
            } | tee registry-freshness.txt
            echo "::warning::The existing A2A Registry listing is active but its stored card metadata is stale. No new listing was submitted."
          fi

      - name: Upload registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-registry-evidence-${{ github.run_id }}
          path: |
            registry-browser-result.txt
            registry-search.json
            registry-freshness.txt
          if-no-files-found: warn
  production_a2a_probe:
    if: github.event_name != 'pull_request'
    needs: [test, registry_submit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production A2A rejects work while paid offer is paused
        env:
          BASE: https://atlas-worker.hosamhosaam5.workers.dev
        run: |
          set -euo pipefail
          mkdir -p a2a-evidence
          curl --fail-with-body --silent --show-error "$BASE/.well-known/agent-card.json" -o a2a-evidence/agent-card.json
          jq -e '.name=="ATLAS" and any(.supportedInterfaces[]; .url=="https://atlas-worker.hosamhosaam5.workers.dev/a2a" and .protocolBinding=="JSONRPC" and .protocolVersion=="1.0") and (.skills|length)==0 and (.description|contains("paid data-QA offer is paused"))' a2a-evidence/agent-card.json

          ID="atlas-paused-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cat > a2a-evidence/request.json <<EOF
          {"jsonrpc":"2.0","id":"$ID","method":"message/send","params":{"message":{"messageId":"$ID-message","role":"user","parts":[{"kind":"text","text":"Read-only interoperability safety probe; do not create a task, order, purchase, payment, or external commitment."}]}}}
          EOF
          STATUS="$(curl --silent --show-error --max-time 20 -D a2a-evidence/headers.txt -o a2a-evidence/response.json -w '%{http_code}' -H 'content-type: application/json' -H 'accept: application/json' --data-binary @a2a-evidence/request.json "$BASE/a2a")"
          echo "A2A status=$STATUS"
          cat a2a-evidence/response.json
          test "$STATUS" = 400
          jq -e --arg id "$ID" '.jsonrpc=="2.0" and .id==$id and .error.code == -32001 and (.error.message|contains("No task was created"))' a2a-evidence/response.json

          GET_ID="atlas-paused-get-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cat > a2a-evidence/task-get-request.json <<EOF
          {"jsonrpc":"2.0","id":"$GET_ID","method":"tasks/get","params":{"id":"atlas-task-not-created-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"}}
          EOF
          GET_STATUS="$(curl --silent --show-error --max-time 20 -o a2a-evidence/task-get-response.json -w '%{http_code}' -H 'content-type: application/json' --data-binary @a2a-evidence/task-get-request.json "$BASE/a2a")"
          test "$GET_STATUS" = 404
          jq -e --arg id "$GET_ID" '.jsonrpc=="2.0" and .id==$id and .error.code == -32004 and .error.message == "Task not found"' a2a-evidence/task-get-response.json

      - name: Verify production commerce and x402 remain fail-closed
        env:
          BASE: https://atlas-worker.hosamhosaam5.workers.dev
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "$BASE/health" -o health.json
          jq -e '.ok==true and .service=="atlas-worker" and .db=="ok"' health.json
          curl --fail-with-body --silent --show-error "$BASE/catalog.json" -o catalog.json
          jq -e '.offer_status=="PAUSED" and (.products|length)==0' catalog.json
          curl --fail-with-body --silent --show-error "$BASE/commerce.json" -o commerce.json
          jq -e '.schema_version=="atlas.commerce.v1" and .provider=="ATLAS" and .audience=="AI agents and agent systems" and .offer_status=="PAUSED" and .pricing==null and .payment==null and .safety.outbound_spend_usdc==0 and .safety.automatic_payouts==false' commerce.json
          STATUS="$(curl --silent --show-error --max-time 20 -D x402-headers.txt -o x402-body.json -w '%{http_code}' "$BASE/x402/atlas_ai_data_qa_v1")"
          test "$STATUS" = 503
          if grep -Eiq '^PAYMENT-REQUIRED:' x402-headers.txt; then
            echo 'Unexpected payment challenge while paid offer is paused.' >&2
            exit 1
          fi
          jq -e '.ok==false and .error=="X402_PRODUCT_NOT_READY"' x402-body.json
          printf 'PASS: production is healthy, A2A creates no task, commerce is paused, x402 has no payment challenge.\n'

      - name: Upload production safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-paused-offer-production-evidence
          path: |
            a2a-evidence/
            health.json
            catalog.json
            commerce.json
            x402-headers.txt
            x402-body.json
          if-no-files-found: warn
