name: ATLAS tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete test suite
        run: npm test

  registry_submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check existing public Registry entry before any submit
        id: precheck
        env:
          AGENT_URL: https://atlas-worker.hosamhosaam5.workers.dev/.well-known/agent-card.json
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error 'https://api.a2a-registry.org/public/agents?q=ATLAS' -o registry-precheck.json
          cat registry-precheck.json
          if grep -Fq "$AGENT_URL" registry-precheck.json; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ATLAS registry entry already exists; skipping Submit Agent to avoid duplicates."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Register ATLAS through Submit Agent
        if: steps.precheck.outputs.exists != 'true'
        env:
          AGENT_URL: https://atlas-worker.hosamhosaam5.workers.dev/.well-known/agent-card.json
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            let browser;
            let body = '';
            try {
              browser = await chromium.launch({headless:true});
              const page = await browser.newPage();
              page.on('requestfailed', r => console.log('[requestfailed]', r.url(), r.failure()?.errorText || 'unknown'));
              await page.goto('https://www.a2a-registry.org/submit', {waitUntil:'domcontentloaded', timeout:60000});
              await page.waitForLoadState('networkidle', {timeout:30000}).catch(()=>{});
              console.log('submit_page=', page.url());
              console.log('title=', await page.title());
              console.log('inputs=', JSON.stringify(await page.locator('input').evaluateAll(els => els.map(e => ({type:e.type,name:e.name,placeholder:e.placeholder,aria:e.getAttribute('aria-label')}))));
              await page.locator('input').first().fill(process.env.AGENT_URL);
              console.log('buttons=', JSON.stringify(await page.locator('button').evaluateAll(els => els.map(e => (e.innerText || e.textContent || '').trim()))));
              await page.getByRole('button', {name:/scan agent/i}).click();
              await page.waitForTimeout(5000);
              await page.waitForLoadState('networkidle', {timeout:30000}).catch(()=>{});
              console.log('preview_url=', page.url());
              body = await page.locator('body').innerText();
              console.log('preview_text=', body.slice(0,20000));
              if (/captcha|verify you are human|access denied/i.test(body)) throw new Error('ANTI_BOT_OR_ACCESS_BLOCK');
              await page.locator('button').last().click();
              await page.waitForTimeout(7000);
              await page.waitForLoadState('networkidle', {timeout:30000}).catch(()=>{});
              console.log('final_url=', page.url());
              body = await page.locator('body').innerText();
              console.log('final_text=', body.slice(0,30000));
              fs.writeFileSync('registry-browser-result.txt', body.slice(0,30000));
              if (/captcha|verify you are human|access denied/i.test(body)) throw new Error('ANTI_BOT_OR_ACCESS_BLOCK');
              if (!/ATLAS|successfully|agent id|package name|unclaimed/i.test(body)) throw new Error('NO_SUCCESS_SIGNAL');
            } finally {
              if (!fs.existsSync('registry-browser-result.txt')) fs.writeFileSync('registry-browser-result.txt', body.slice(0,30000));
              if (browser) await browser.close().catch(()=>{});
            }
          })().catch(err => { console.error(err.stack || String(err)); throw err; });
          NODE

      - name: Verify public registry independently
        if: success()
        env:
          AGENT_URL: https://atlas-worker.hosamhosaam5.workers.dev/.well-known/agent-card.json
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error 'https://api.a2a-registry.org/public/agents?q=ATLAS' -o registry-search.json
          cat registry-search.json
          grep -Fq "$AGENT_URL" registry-search.json
      - name: Upload registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-registry-evidence-${{ github.run_id }}
          path: |
            registry-browser-result.txt
            registry-search.json
          if-no-files-found: warn
  production_a2a_probe:
    if: github.event_name != 'pull_request'
    needs: [test, registry_submit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Production A2A probe
        env:
          CARD: https://atlas-worker.hosamhosaam5.workers.dev/.well-known/agent-card.json
        run: |
          set -euo pipefail
          mkdir -p a2a-evidence
          curl --fail-with-body --silent --show-error -H 'accept: application/json' "$CARD" -o a2a-evidence/agent-card.json
          ENDPOINT="$(jq -er '.supportedInterfaces[0] | select(.protocolBinding=="JSONRPC" and .protocolVersion=="1.0") | .url' a2a-evidence/agent-card.json)"
          test "$ENDPOINT" = "https://atlas-worker.hosamhosaam5.workers.dev/a2a"
          ID="atlas-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cat > a2a-evidence/request.json <<EOF
          {"jsonrpc":"2.0","id":"$ID","method":"message/send","params":{"message":{"messageId":"$ID-message","role":"user","parts":[{"kind":"text","text":"ATLAS interoperability probe; no purchase, payment, order, customer data, or external commitment."}]}}}
          EOF
          curl -sS -D a2a-evidence/headers.txt -o a2a-evidence/response.json -w '%{http_code}' -H 'content-type: application/json' -H 'accept: application/json' --data-binary @a2a-evidence/request.json "$ENDPOINT" > a2a-evidence/http-status.txt
          STATUS="$(cat a2a-evidence/http-status.txt)"
          TYPE="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/\r$/,"" ); print}' a2a-evidence/headers.txt | tail -1 | sed 's/^[^:]*:[[:space:]]*//')"
          printf 'endpoint=%s\nhttp_status=%s\ncontent_type=%s\nrequest_id=%s\n' "$ENDPOINT" "$STATUS" "$TYPE" "$ID" | tee a2a-evidence/metadata.txt
          cat a2a-evidence/response.json
          test "$STATUS" = 200
          printf '%s' "$TYPE" | grep -Eiq '^application/json([;[:space:]]|$)'
          jq -e --arg id "$ID" '.jsonrpc=="2.0" and .id==$id and (.result != null) and (.error == null)' a2a-evidence/response.json
      - name: Verify persisted task lifecycle
        run: |
          set -euo pipefail
          ID="atlas-task-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cat > task-request.json <<EOF
          {"jsonrpc":"2.0","id":"$ID","method":"message/send","params":{"message":{"messageId":"$ID-message","role":"user","parts":[{"kind":"text","text":"ATLAS task lifecycle probe; no purchase, payment, order, customer data, or external commitment."}]}}}
          EOF
          curl --fail-with-body --silent --show-error -H 'content-type: application/json' --data-binary @task-request.json https://atlas-worker.hosamhosaam5.workers.dev/a2a -o task-send.json
          cat task-send.json
          TASK_ID="$(jq -er '.result.id' task-send.json)"
          test "$(jq -r '.result.status.state' task-send.json)" = submitted
          cat > task-get-request.json <<EOF
          {"jsonrpc":"2.0","id":"$ID-get","method":"tasks/get","params":{"id":"$TASK_ID"}}
          EOF
          curl --fail-with-body --silent --show-error -H 'content-type: application/json' --data-binary @task-get-request.json https://atlas-worker.hosamhosaam5.workers.dev/a2a -o task-get.json
          cat task-get.json
          jq -e --arg task "$TASK_ID" '.jsonrpc=="2.0" and .result.id==$task and .result.status.state=="submitted" and .result.metadata.source=="A2A"' task-get.json

      - name: Verify production catalog and x402 payment challenge
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error https://atlas-worker.hosamhosaam5.workers.dev/catalog.json -o catalog.json
          cat catalog.json
          jq -e '.products[] | select(.id=="atlas_ai_data_qa_v1" and .status=="ACTIVE" and (.price_usdc|tonumber)==15)' catalog.json
          curl -sS -D x402-headers.txt -o x402-body.json -w '%{http_code}' https://atlas-worker.hosamhosaam5.workers.dev/x402/atlas_ai_data_qa_v1 > x402-status.txt
          printf 'x402_status='; cat x402-status.txt; echo
          echo '--- x402 headers ---'; sed -n '1,120p' x402-headers.txt
          echo '--- x402 body bytes ---'; wc -c x402-body.json
          echo '--- x402 body ---'; cat x402-body.json; echo
          test "$(cat x402-status.txt)" = 402
          grep -Eiq '^PAYMENT-REQUIRED:' x402-headers.txt
          PAYMENT_REQUIRED="$(awk 'BEGIN{IGNORECASE=1} /^PAYMENT-REQUIRED:/{sub(/\r$/,""); sub(/^[^:]*:[[:space:]]*/,""); print}' x402-headers.txt | tail -1)"
          test -n "$PAYMENT_REQUIRED"
          printf '%s' "$PAYMENT_REQUIRED" | base64 -d > x402-decoded.json
          jq -e '.x402Version==2 and .error=="PAYMENT-SIGNATURE header is required" and (.accepts|length)>0 and .accepts[0].scheme=="exact" and .accepts[0].network=="eip155:8453" and .accepts[0].amount=="15000000" and .accepts[0].payTo=="0x59Ea688b36464133E71873d8BeE8Fcb3BC369383" and .accepts[0].asset=="0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"' x402-decoded.json
          printf 'x402_status='; cat x402-status.txt; echo
          echo '--- x402 headers ---'; sed -n '1,80p' x402-headers.txt
          echo '--- x402 body bytes ---'; wc -c x402-body.json
          echo '--- x402 body ---'; cat x402-body.json; echo
          test "$(cat x402-status.txt)" = 402
          grep -Eiq '^PAYMENT-REQUIRED:' x402-headers.txt
          echo "x402 challenge header present; body is informational because upstream 4xx handling may replace error bodies."
          test -s x402-headers.txt
          grep -Eiq '^PAYMENT-REQUIRED:' x402-headers.txt

      - name: Verify public commerce, trust, and discovery consistency
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # The deploy workflow and this workflow start on the same push. Wait for the
          # public Worker to serve this exact commit before asserting production metadata.
          expected_sha="$GITHUB_SHA"
          actual_sha=""
          for attempt in $(seq 1 30); do
            health_json="$(curl --fail --silent --show-error --max-time 10 https://atlas-worker.hosamhosaam5.workers.dev/health || true)"
            actual_sha="$(printf '%s' "$health_json" | jq -r '.git_sha // ""' 2>/dev/null || true)"
            if [ "$actual_sha" = "$expected_sha" ]; then
              echo "Production Worker source verified: $actual_sha"
              break
            fi
            echo "Waiting for deployment propagation: expected=$expected_sha actual=${actual_sha:-missing} attempt=$attempt"
            sleep 2
          done
          test "$actual_sha" = "$expected_sha"
          BASE='https://atlas-worker.hosamhosaam5.workers.dev'
          curl --fail-with-body --silent --show-error "$BASE/commerce.json" -o commerce.json
          curl --fail-with-body --silent --show-error "$BASE/trust.json" -o trust.json
          curl --fail-with-body --silent --show-error "$BASE/llms.txt" -o llms.txt
          echo '--- commerce.json ---'; cat commerce.json
          echo '--- trust.json ---'; cat trust.json
          echo '--- llms.txt (head) ---'; sed -n '1,120p' llms.txt
          jq -e '.schema_version=="atlas.commerce.v1" and .provider=="ATLAS" and .audience=="AI agents and agent systems" and .product_id=="atlas_ai_data_qa_v1"' commerce.json
          jq -e '.pricing.mode=="FOUNDER_QUOTE" and (.pricing.indicative_usdc|tonumber)==15' commerce.json
          jq -e '.protocols.a2a=="https://atlas-worker.hosamhosaam5.workers.dev/a2a" and .protocols.x402_requirements=="https://atlas-worker.hosamhosaam5.workers.dev/x402/atlas_ai_data_qa_v1" and .payment.network=="eip155:8453" and .payment.asset=="0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913" and .payment.payTo=="0x59Ea688b36464133E71873d8BeE8Fcb3BC369383" and .payment.x402_settlement=="IMPLEMENTED_UNVERIFIED"' commerce.json
          jq -e '.ok==true and .verified==true and (.metrics.delivered_orders|tonumber)>=0 and (.metrics.paid_orders|tonumber)>=0 and (.metrics.failed_or_review_orders|tonumber)>=0 and .verification_scope=="LIVE_LEDGER_QUERY; REAL_BASE_TX_HASH_REQUIRED; MOCK_TESTNET_SIMULATION_EXCLUDED" and (.metrics.simulated_orders_excluded|tonumber)>=0 and (.metrics.simulated_paid_orders_excluded|tonumber)>=0 and (.metrics.verified_production_orders|tonumber)>=0 and (.recent|length)<=20' trust.json
          grep -Fq 'atlas_ai_data_qa_v1' llms.txt
          grep -Fq 'https://atlas-worker.hosamhosaam5.workers.dev/a2a' llms.txt
          grep -Fq 'https://atlas-worker.hosamhosaam5.workers.dev/x402/atlas_ai_data_qa_v1' llms.txt
          curl --fail-with-body --silent --show-error "$BASE/.well-known/agent-card.json" -o agent-card-consistency.json
          jq -e '.name=="ATLAS" and any(.supportedInterfaces[]; .url=="https://atlas-worker.hosamhosaam5.workers.dev/a2a" and .protocolBinding=="JSONRPC" and .protocolVersion=="1.0")' agent-card-consistency.json
          jq -e 'any(.capabilities.extensions[]; .uri=="https://a2a-registry.org/extensions/registry/v1" and .params.identity.provider=="github" and .params.identity.username=="hosamhosaam5-ops" and .params.identity.packageName=="github.hosamhosaam5-ops.atlas")' agent-card-consistency.json
          jq -e 'any(.capabilities.extensions[]; .uri=="https://atlas-worker.hosamhosaam5.workers.dev/extensions/commerce/v1" and .params.settlement=="BASE_RPC_INBOUND" and .params.x402Settlement=="IMPLEMENTED_UNVERIFIED")' agent-card-consistency.json

      - name: Upload A2A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-a2a-production-probe-${{ github.run_id }}
          path: |
            a2a-evidence/
            x402-headers.txt
            x402-body.json
            x402-status.txt
            catalog.json
          if-no-files-found: warn
