name: atlas-worker-deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - "schema*.sql"
      - "migrations/**"
      - ".github/workflows/atlas-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock --ignore-scripts
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Smoke-start Worker runtime
        run: |
          set +e
          timeout 15s npx wrangler dev --local --port 8797 --persist-to .wrangler-smoke --var AI_PROVIDER:WORKERS_AI --var TELEGRAM_PROVIDER:LIVE
          rc=$?
          if [ "$rc" -eq 124 ]; then exit 0; fi
          exit "$rc"
      - run: npm test
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c46718094ced1f5f75492f4c67c7d390
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$GITHUB_SHA"
          npx wrangler deploy --var ATLAS_GIT_SHA:$GITHUB_SHA
      - name: Verify deployed source SHA
        run: |
          set -euo pipefail
          EXPECTED_SHA="$GITHUB_SHA"
          test -n "$EXPECTED_SHA"
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 10 https://atlas-worker.hosamhosaam5.workers.dev/health -o health.json; then
              cat health.json
              ACTUAL_SHA="$(jq -r '.git_sha // ""' health.json)"
              if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
                echo "DEPLOYED_SOURCE_SHA=$ACTUAL_SHA"
                exit 0
              fi
              echo "Waiting for Worker propagation: expected=$EXPECTED_SHA actual=${ACTUAL_SHA:-missing} attempt=$attempt"
            else
              echo "Health request failed attempt=$attempt"
            fi
            sleep 2
          done
          echo "SOURCE_SHA_VERIFICATION_FAILED expected=$EXPECTED_SHA"
          exit 1
