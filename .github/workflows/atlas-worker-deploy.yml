name: atlas-worker-deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - "schema*.sql"
      - "migrations/**"
      - ".github/workflows/atlas-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock --ignore-scripts
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Smoke-start Worker runtime
        run: |
          set +e
          timeout 15s npx wrangler dev --local --port 8797 --persist-to .wrangler-smoke --var AI_PROVIDER:WORKERS_AI --var TELEGRAM_PROVIDER:LIVE
          rc=$?
          if [ "$rc" -eq 124 ]; then exit 0; fi
          exit "$rc"
      - run: npm test
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c46718094ced1f5f75492f4c67c7d390
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 migrations apply atlas_db --remote
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c46718094ced1f5f75492f4c67c7d390
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deploy
# Deployment trigger: deploy current main, including commit 32bea5f8a473b461db3096c8cfc5784aa1e560f7
# Force deployment after Workers AI migration: 2026-10-02
# Verified source refresh trigger: pipeline/provider/index/current MCP OAuth tests on main.
