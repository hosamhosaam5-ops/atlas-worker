name: ATLAS CI
# Canonical repository test gate: npm ci + npm test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node --test --test-concurrency=1 test/*.test.mjs
