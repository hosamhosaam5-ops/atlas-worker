name: ATLAS Clean v1 isolated trial

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/triggers/clean-v1-trial.trigger"

permissions:
  contents: read

concurrency:
  group: atlas-clean-v1-trial
  cancel-in-progress: false

jobs:
  trial:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check one-shot trial marker
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          marker="$(tr -d '\r\n' < ops/triggers/clean-v1-trial.trigger)"
          if [ "$marker" = "RUN" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
            echo "ARMED | isolated Clean v1 trial"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "SKIP | Clean v1 trial marker is disarmed"
          fi

      - name: Set up Node.js
        if: steps.gate.outputs.armed == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Install locked Wrangler dependencies
        if: steps.gate.outputs.armed == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate isolated config and preflight exact trial resources
        id: preflight
        if: steps.gate.outputs.armed == 'true'
        env:
          CF_TRIAL_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CF_ACCOUNT_ID: c46718094ced1f5f75492f4c67c7d390
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test -f wrangler.clean-v1-trial.toml
          grep -q '^name = "atlas-clean-v1-trial"$' wrangler.clean-v1-trial.toml
          grep -q '^main = "src/clean-v1/worker.js"$' wrangler.clean-v1-trial.toml
          ! grep -Eiq 'atlas_db|d1_databases|queue|durable_object|CLOUDFLARE_API_TOKEN|CF_TRIAL_API_TOKEN' wrangler.clean-v1-trial.toml
          [ -n "${CF_TRIAL_API_TOKEN:-}" ] || { echo "FAIL | CF_TRIAL_API_TOKEN missing"; exit 1; }
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const token = process.env.CF_TRIAL_API_TOKEN;
          const account = process.env.CF_ACCOUNT_ID;
          const api = 'https://api.cloudflare.com/client/v4';
          async function get(path) {
            const response = await fetch(api + path, {
              headers: { authorization: 'Bearer ' + token, accept: 'application/json' },
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success !== true) {
              console.log('FAIL | Cloudflare read preflight (HTTP ' + response.status + ')');
              process.exit(1);
            }
            return body.result;
          }
          const [scripts, namespaces, subdomain] = await Promise.all([
            get('/accounts/' + account + '/workers/scripts'),
            get('/accounts/' + account + '/workers/durable_objects/namespaces?per_page=1000'),
            get('/accounts/' + account + '/workers/subdomain'),
          ]);
          const name = 'atlas-clean-v1-trial';
          const exists = (scripts || []).some(x => [x.id, x.name, x.script_name].includes(name));
          const hasNamespaces = (namespaces || []).some(x => x.script === name);
          if (exists || hasNamespaces) {
            console.log('FAIL | trial resource name already exists; refusing overwrite or reuse');
            process.exit(1);
          }
          if (!subdomain?.subdomain) {
            console.log('FAIL | Workers Scripts Read: workers.dev subdomain unavailable');
            process.exit(1);
          }
          const baseUrl = 'https://' + name + '.' + subdomain.subdomain + '.workers.dev';
          appendFileSync(process.env.GITHUB_ENV, 'TRIAL_BASE_URL=' + baseUrl + '\n');
          appendFileSync(process.env.GITHUB_OUTPUT, 'base_url=' + baseUrl + '\n');
          console.log('PASS | isolated config verified; Worker and namespace names unused');
          console.log('TRIAL_BASE_URL=' + baseUrl);
          NODE

      - name: Deploy atlas-clean-v1-trial exactly once
        id: deploy
        if: steps.gate.outputs.armed == 'true'
        env:
          CF_TRIAL_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CF_ACCOUNT_ID: c46718094ced1f5f75492f4c67c7d390
        shell: bash
        run: |
          set +x
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { redactWranglerOutput } from './ops/scripts/redact-wrangler-output.mjs';
          const token = process.env.CF_TRIAL_API_TOKEN;
          const account = process.env.CF_ACCOUNT_ID;
          const result = spawnSync('./node_modules/.bin/wrangler', ['deploy', '--config', 'wrangler.clean-v1-trial.toml'], {
            encoding: 'utf8',
            maxBuffer: 8 * 1024 * 1024,
            env: {
              ...process.env,
              CLOUDFLARE_API_TOKEN: token,
              CLOUDFLARE_ACCOUNT_ID: account,
            },
          });
          const raw = [result.stdout, result.stderr, result.error?.message].filter(Boolean).join('\n');
          const safe = redactWranglerOutput(raw, [token, account]);
          console.log('----- sanitized Wrangler deploy output -----');
          process.stdout.write(safe.endsWith('\n') ? safe : safe + '\n');
          console.log('----- end sanitized Wrangler output -----');
          if (result.error || result.status !== 0) {
            console.log('FAIL | single Wrangler deploy attempt did not complete');
            process.exit(1);
          }
          console.log('PASS | one isolated Worker deploy completed');
          NODE

      - name: Wait for preview route, then run one 10-row and one 100-row upload plus unpaid 402
        id: probe
        if: steps.gate.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node ops/scripts/clean-v1-trial-probe.mjs "$TRIAL_BASE_URL"

      - name: Read CPU quantiles and invocation status counts from Cloudflare Analytics
        if: always() && steps.gate.outputs.armed == 'true' && steps.preflight.outcome == 'success' && steps.deploy.outcome == 'success'
        env:
          CF_TRIAL_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CF_ACCOUNT_ID: c46718094ced1f5f75492f4c67c7d390
        shell: bash
        run: |
          set +x
          node --input-type=module <<'NODE'
          const token = process.env.CF_TRIAL_API_TOKEN;
          const account = process.env.CF_ACCOUNT_ID;
          const query = `query CleanV1TrialMetrics {
            cpuQuantileSchema: __type(name: "AccountWorkersInvocationsAdaptiveQuantiles") {
              fields { name description }
            }
            viewer {
              accounts(filter: { accountTag: "${account}" }) {
                workersInvocationsAdaptive(limit: 100, filter: {
                  scriptName: "atlas-clean-v1-trial",
                  datetime_geq: "${new Date(Date.now() - 30 * 60 * 1000).toISOString()}",
                  datetime_leq: "${new Date(Date.now() + 60 * 1000).toISOString()}"
                }) {
                  dimensions { datetime scriptName status httpResponseStatus }
                  sum { requests errors }
                  quantiles { cpuTimeP50 cpuTimeP99 }
                }
              }
            }
          }`;
          let rows = [];
          let payload = null;
          let analyticsUnknown = false;
          for (let attempt = 1; attempt <= 6; attempt++) {
            let response;
            try {
              response = await fetch('https://api.cloudflare.com/client/v4/graphql', {
                method: 'POST',
                headers: {
                  authorization: 'Bearer ' + token,
                  'content-type': 'application/json',
                  accept: 'application/json',
                },
                body: JSON.stringify({ query }),
              });
            } catch {
              console.log('UNKNOWN | Cloudflare Analytics network request failed');
              analyticsUnknown = true;
              break;
            }
            if (!response.ok) {
              console.log('UNKNOWN | Cloudflare Analytics API unavailable (HTTP ' + response.status + ')');
              analyticsUnknown = true;
              break;
            }
            payload = await response.json().catch(() => null);
            if (!payload || payload.errors?.length || !payload.data) {
              console.log('UNKNOWN | Cloudflare Analytics response did not contain a valid metrics result');
              analyticsUnknown = true;
              break;
            }
            rows = payload.data.viewer?.accounts?.[0]?.workersInvocationsAdaptive || [];
            const total = rows.reduce((sum, item) => sum + Number(item.sum?.requests || 0), 0);
            if (rows.length && total >= 3) break;
            if (attempt < 6) await new Promise(resolve => setTimeout(resolve, 20_000));
          }

          if (analyticsUnknown || !payload) {
            console.log('CPU_QUANTILE_UNIT=MICROSECONDS (verified separately by Cloudflare GraphQL introspection before arming)');
            console.log('UNKNOWN | request and CPU metric values unavailable; no resource-overrun result can be claimed');
            process.exit(0);
          }

          const schemaFields = payload.data.cpuQuantileSchema?.fields || [];
          const schemaP50 = schemaFields.find(field => field.name === 'cpuTimeP50');
          const schemaP99 = schemaFields.find(field => field.name === 'cpuTimeP99');
          const unitVerified = /microseconds/i.test(schemaP50?.description || '') &&
            /microseconds/i.test(schemaP99?.description || '');
          console.log('CPU_QUANTILE_SCHEMA=' + JSON.stringify({
            type: 'AccountWorkersInvocationsAdaptiveQuantiles',
            cpuTimeP50: schemaP50?.description || null,
            cpuTimeP99: schemaP99?.description || null,
          }));
          console.log('CPU_QUANTILE_UNIT=' + (unitVerified ? 'MICROSECONDS' : 'UNKNOWN'));

          if (!rows.length) {
            console.log('UNKNOWN | no Cloudflare Analytics invocation rows returned after polling');
            console.log('INVOCATION_STATUS_COUNTS=UNKNOWN');
            console.log('HTTP_RESPONSE_STATUS_COUNTS=UNKNOWN');
            console.log('RESOURCE_OVERRUN=UNKNOWN');
            process.exit(0);
          }

          const summary = rows.map(item => ({
            datetime: item.dimensions?.datetime,
            status: item.dimensions?.status ?? 'UNKNOWN',
            httpResponseStatus: item.dimensions?.httpResponseStatus ?? null,
            requests: Number(item.sum?.requests || 0),
            errors: Number(item.sum?.errors || 0),
            cpuTimeP50: item.quantiles?.cpuTimeP50 ?? null,
            cpuTimeP99: item.quantiles?.cpuTimeP99 ?? null,
          }));
          console.log('CLOUDFLARE_ANALYTICS_RAW=' + JSON.stringify(summary));

          const invocationStatusCounts = {};
          const httpResponseStatusCounts = {};
          let totalRequests = 0;
          let totalErrors = 0;
          let resourceOverrunRequests = 0;
          const resourceOverrunStatuses = [];
          for (const item of summary) {
            const status = String(item.status || 'UNKNOWN');
            const requests = Number.isFinite(item.requests) ? item.requests : 0;
            invocationStatusCounts[status] = (invocationStatusCounts[status] || 0) + requests;
            const httpStatus = item.httpResponseStatus === null ? 'UNKNOWN' : String(item.httpResponseStatus);
            httpResponseStatusCounts[httpStatus] = (httpResponseStatusCounts[httpStatus] || 0) + requests;
            totalRequests += requests;
            totalErrors += Number.isFinite(item.errors) ? item.errors : 0;
            if (/exceeded(resources|cpu)/i.test(status)) {
              resourceOverrunRequests += requests;
              if (!resourceOverrunStatuses.includes(status)) resourceOverrunStatuses.push(status);
            }
          }

          console.log('ANALYTICS_TOTAL_REQUESTS=' + totalRequests);
          console.log('ANALYTICS_TOTAL_ERRORS=' + totalErrors);
          console.log('INVOCATION_STATUS_COUNTS=' + JSON.stringify(invocationStatusCounts));
          console.log('HTTP_RESPONSE_STATUS_COUNTS=' + JSON.stringify(httpResponseStatusCounts));
          console.log('RESOURCE_OVERRUN_STATUSES=' + JSON.stringify(resourceOverrunStatuses));
          console.log('RESOURCE_OVERRUN_REQUESTS=' + resourceOverrunRequests);
          if (resourceOverrunRequests > 0) {
            console.log('RESOURCE_OVERRUN=CONFIRMED');
            console.log('ACTION_REQUIRED | do not redeploy; create separate row-cap reduction PR and wait for owner signal: ابدأ التجربة 3');
            process.exit(1);
          }
          console.log('RESOURCE_OVERRUN=NOT_OBSERVED_IN_RETURNED_INVOCATION_STATUSES');
          console.log('NOTE | CPU quantiles are reported as raw microseconds; high quantiles alone are not treated as proof of an exceeded-resource invocation.');
          NODE
      - name: Always clean up only atlas-clean-v1-trial and independently verify absence
        if: always() && steps.gate.outputs.armed == 'true' && steps.preflight.outcome == 'success'
        env:
          CF_TRIAL_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CF_ACCOUNT_ID: c46718094ced1f5f75492f4c67c7d390
        shell: bash
        run: |
          set +x
          set -euo pipefail
          [ -n "${CF_TRIAL_API_TOKEN:-}" ] || { echo "FAIL | CF_TRIAL_API_TOKEN missing; cleanup cannot be verified"; exit 1; }
          node --input-type=module <<'NODE'
          const token = process.env.CF_TRIAL_API_TOKEN;
          const account = process.env.CF_ACCOUNT_ID;
          const api = 'https://api.cloudflare.com/client/v4';
          const name = 'atlas-clean-v1-trial';
          async function request(method, path) {
            const response = await fetch(api + path, {
              method,
              headers: {
                authorization: 'Bearer ' + token,
                accept: 'application/json',
                'content-type': 'application/json',
              },
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.success !== true) {
              console.log('FAIL | Cloudflare cleanup ' + method + ' (HTTP ' + response.status + ')');
              process.exit(1);
            }
            return payload.result;
          }

          const base = '/accounts/' + account;
          const [scriptsBefore, namespacesBefore] = await Promise.all([
            request('GET', base + '/workers/scripts'),
            request('GET', base + '/workers/durable_objects/namespaces?per_page=1000'),
          ]);
          const exists = (scriptsBefore || []).some(item => [item.id, item.name, item.script_name].includes(name));
          const associatedBefore = (namespacesBefore || []).filter(item => item.script === name);
          if (associatedBefore.length) {
            console.log('FAIL | unexpected Durable Object namespace associated with trial Worker; refusing deletion outside exact Worker allowlist');
            process.exit(1);
          }

          if (exists) {
            await request('DELETE', base + '/workers/scripts/' + name);
            console.log('PASS | deleted exact allowlisted Worker atlas-clean-v1-trial');
          } else {
            console.log('PASS | exact allowlisted Worker already absent; no delete request');
          }

          // New GETs after the delete attempt: independent read-after-delete verification.
          const [scriptsAfter, namespacesAfter] = await Promise.all([
            request('GET', base + '/workers/scripts'),
            request('GET', base + '/workers/durable_objects/namespaces?per_page=1000'),
          ]);
          const workerPresent = (scriptsAfter || []).some(item => [item.id, item.name, item.script_name].includes(name));
          const associatedAfter = (namespacesAfter || []).filter(item => item.script === name);
          const result = {
            target: name,
            workerPresent,
            associatedDurableObjectNamespaces: associatedAfter.length,
          };
          console.log('CLEANUP_READBACK=' + JSON.stringify(result));
          if (workerPresent || associatedAfter.length) {
            console.log('FAIL | independent read-after-delete did not confirm absence');
            process.exit(1);
          }
          console.log('PASS | independent read-after-delete confirmed no trial Worker or associated DO namespace');
          NODE

