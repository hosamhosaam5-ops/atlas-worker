name: ATLAS D1 apply migration 0007

on:
  push:
    branches: [main]
    paths:
      - 'ops/triggers/apply-0007.trigger'
  pull_request:
    paths:
      - '.github/workflows/d1-apply-0007.yml'
      - 'ops/scripts/d1-apply-0007.mjs'
      - 'ops/triggers/apply-0007.trigger'
      - 'migrations/0007_demand_query_indexes.sql'
      - 'test/d1-apply-0007-static.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-d1-apply-0007
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request commit
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate guarded helper syntax
        run: node --check ops/scripts/d1-apply-0007.mjs
      - name: Validate the migration is strictly additive and allowlisted
        run: node --test test/d1-apply-0007-static.test.mjs

  apply-0007:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact approved trigger commit
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked Wrangler dependency
        run: npm ci --no-audit --no-fund

      - name: Validate guarded helper syntax
        run: node --check ops/scripts/d1-apply-0007.mjs

      - name: Read-only production preflight and source-cycle verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node ops/scripts/d1-apply-0007.mjs preflight

      - name: Capture one fresh production D1 bookmark
        id: restore_point
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node ops/scripts/d1-apply-0007.mjs capture

      - name: Require same-run bookmark younger than two hours
        env:
          D1_BOOKMARK: ${{ steps.restore_point.outputs.d1_bookmark }}
          D1_BOOKMARK_CAPTURED_AT_MS: ${{ steps.restore_point.outputs.d1_bookmark_captured_at_ms }}
          D1_BOOKMARK_RUN_ID: ${{ steps.restore_point.outputs.d1_bookmark_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node ops/scripts/d1-apply-0007.mjs guard

      - name: Re-check bookmark immediately before the allowlisted write
        env:
          D1_BOOKMARK: ${{ steps.restore_point.outputs.d1_bookmark }}
          D1_BOOKMARK_CAPTURED_AT_MS: ${{ steps.restore_point.outputs.d1_bookmark_captured_at_ms }}
          D1_BOOKMARK_RUN_ID: ${{ steps.restore_point.outputs.d1_bookmark_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node ops/scripts/d1-apply-0007.mjs guard

      - name: Execute exactly migrations/0007_demand_query_indexes.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          SQL_FILE='migrations/0007_demand_query_indexes.sql'
          ALLOWED_SQL_FILE='migrations/0007_demand_query_indexes.sql'
          if [ "$SQL_FILE" != "$ALLOWED_SQL_FILE" ]; then
            echo "::error::SQL file is not on the explicit 0007 allowlist."
            exit 1
          fi
          test -s "$SQL_FILE"
          SQL_SHA256="$(sha256sum "$SQL_FILE" | cut -d ' ' -f1)"
          echo "Allowlisted SQL SHA-256: $SQL_SHA256"
          npx --no-install wrangler d1 execute atlas_db --remote --file="$SQL_FILE"
          echo "Executed only $SQL_FILE"

      - name: Verify all six indexes, row-count invariance and production health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node ops/scripts/d1-apply-0007.mjs verify

      - name: Remove ephemeral aggregate baseline
        if: always()
        shell: bash
        run: rm -f .d1-0007-preflight.json
