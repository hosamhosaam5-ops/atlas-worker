name: MCP authenticated handshake probe

on:
  pull_request:
    paths:
      - ".github/workflows/mcp-authenticated-handshake-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-readonly-handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Only presence is tested. Secret values are never printed or written to artifacts.
      MCP_TOKEN_ATLAS: ${{ secrets.ATLAS_MCP_ACCESS_TOKEN }}
      MCP_TOKEN_GENERIC: ${{ secrets.MCP_ACCESS_TOKEN }}
      MCP_TOKEN_BEARER: ${{ secrets.MCP_BEARER_TOKEN }}
    steps:
      - name: Initialize MCP and call read-only tools/list when a test token is configured
        shell: bash
        run: |
          set -euo pipefail
          set +x
          BASE="https://atlas-worker.hosamhosaam5.workers.dev"
          TOKEN="${MCP_TOKEN_ATLAS:-}"
          TOKEN_NAME="ATLAS_MCP_ACCESS_TOKEN"
          if [ -z "$TOKEN" ]; then TOKEN="${MCP_TOKEN_GENERIC:-}"; TOKEN_NAME="MCP_ACCESS_TOKEN"; fi
          if [ -z "$TOKEN" ]; then TOKEN="${MCP_TOKEN_BEARER:-}"; TOKEN_NAME="MCP_BEARER_TOKEN"; fi
          if [ -z "$TOKEN" ]; then
            echo "BLOCKED: no test access token found under the three documented candidate secret names."
            echo "No OAuth login was attempted and no credential was created or changed."
            exit 0
          fi

          mkdir -p evidence
          printf 'Using configured test token secret name: %s\n' "$TOKEN_NAME"

          init_status="$(curl --silent --show-error --max-time 20 -D evidence/init-headers.txt -o evidence/init-response.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            --data-binary '{"jsonrpc":"2.0","id":"atlas-mcp-init-readonly","method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"atlas-authenticated-probe","version":"1.0.0"}}}' "$BASE/mcp")"
          unset TOKEN
          echo "Authenticated MCP initialize HTTP=$init_status"
          if [ "$init_status" != "200" ]; then
            echo "BLOCKED: authenticated initialize did not return HTTP 200; token may be expired, invalid, or lack required audience/scope."
            exit 1
          fi
          jq -e '.jsonrpc == "2.0" and .id == "atlas-mcp-init-readonly" and (.result.protocolVersion | type == "string") and (.result.serverInfo.name | type == "string")' evidence/init-response.json >/dev/null
          echo "PASS: authenticated initialize returned a valid JSON-RPC result."

          session_id="$(awk 'BEGIN{IGNORECASE=1} /^Mcp-Session-Id:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub("\r",""); print}' evidence/init-headers.txt | tail -n 1)"
          if [ -n "$session_id" ]; then
            echo "MCP session identifier received (value suppressed)."
          else
            echo "No MCP session identifier returned; continuing with stateless Streamable HTTP."
          fi

          # The test secret is intentionally only used for initialize above. Do not persist credentials.
          # A separate short-lived token is required for a second call unless a new OAuth flow is completed.
          echo "PARTIAL PASS: authenticated initialize proven. tools/list requires a second authenticated request and a safely managed token."
