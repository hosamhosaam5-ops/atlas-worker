name: Deploy and measure isolated data-cleaning trial

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/triggers/trial-deploy.trigger"

permissions:
  contents: read

concurrency:
  group: atlas-data-cleaning-trial
  cancel-in-progress: false

jobs:
  deploy-measure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Check one-shot deployment marker
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          activation="$(sed -n '1p' ops/triggers/trial-deploy.trigger | tr -d '\r')"
          free_plan_confirmation="$(sed -n '2p' ops/triggers/trial-deploy.trigger | tr -d '\r')"
          extra_marker_line="$(sed -n '3p' ops/triggers/trial-deploy.trigger | tr -d '\r')"
          if [ "$activation" = "RUN" ] && [ "$free_plan_confirmation" = "OWNER_CONFIRMED_WORKERS_FREE" ] && [ -z "$extra_marker_line" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
            echo "free_plan_confirmed=true" >> "$GITHUB_OUTPUT"
            echo "ARMED | isolated trial deployment; Workers Free plan owner-confirmed"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "SKIP | trial deployment requires RUN and OWNER_CONFIRMED_WORKERS_FREE marker lines"
          fi

      - name: Verify both required secrets are configured
        if: steps.gate.outputs.armed == 'true'
        env:
          CF_TRIAL_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CLEANING_API_TOKEN: ${{ secrets.CLEANING_API_TOKEN }}
        shell: bash
        run: |
          set +x
          [ -n "${CF_TRIAL_API_TOKEN:-}" ] || { echo "FAIL | CF_TRIAL_API_TOKEN"; exit 1; }
          [ -n "${CLEANING_API_TOKEN:-}" ] || { echo "FAIL | CLEANING_API_TOKEN"; exit 1; }
          [ "${#CLEANING_API_TOKEN}" -ge 32 ] || { echo "FAIL | CLEANING_API_TOKEN length (minimum 32 characters)"; exit 1; }
          if ! [[ "$CLEANING_API_TOKEN" =~ ^[A-Za-z0-9._~+/-]{32,512}$ ]]; then
            echo "FAIL | CLEANING_API_TOKEN format (allowed bearer-token characters only)"
            exit 1
          fi
          echo "PASS | required trial secrets are present; values not displayed"

      - name: Set up Node.js
        if: steps.gate.outputs.armed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        if: steps.gate.outputs.armed == 'true'
        run: npm ci --ignore-scripts

      - name: Verify trial config is isolated from production
        if: steps.gate.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f wrangler.data-cleaning-trial.toml
          grep -q '^name = "atlas-data-cleaning-trial"$' wrangler.data-cleaning-trial.toml
          ! grep -Fq '[limits]' wrangler.data-cleaning-trial.toml
          ! grep -Eq '^[[:space:]]*cpu_ms[[:space:]]*=' wrangler.data-cleaning-trial.toml
          ! grep -Eiq 'atlas_db|d1_databases|CLOUDFLARE_API_TOKEN|CLEANING_API_TOKEN\s*=' wrangler.data-cleaning-trial.toml
          echo "PASS | isolated Worker config: no D1, atlas_db, or literal secret binding"


      - name: Test Wrangler output redaction before provisioning
        if: steps.gate.outputs.armed == 'true'
        run: node --test test/redact-wrangler-output.test.mjs

      - name: Preflight exact resource names and resolve workers.dev hostname
        id: preflight
        if: steps.gate.outputs.armed == 'true'
        env:
          CF_TRIAL_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CF_ACCOUNT_ID: c46718094ced1f5f75492f4c67c7d390
          OWNER_CONFIRMED_WORKERS_FREE: ${{ steps.gate.outputs.free_plan_confirmed }}
        shell: bash
        run: |
          set +x
          node --input-type=module <<'NODE'
          const account = process.env.CF_ACCOUNT_ID;
          const token = process.env.CF_TRIAL_API_TOKEN;
          const base = 'https://api.cloudflare.com/client/v4';
          const headers = { authorization: 'Bearer ' + token, 'content-type': 'application/json' };
          async function get(path, permission) {
            const response = await fetch(base + path, { headers });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body.success === false) {
              console.log('FAIL | ' + (response.status === 403 ? permission : permission + ' (HTTP ' + response.status + ')'));
              process.exit(1);
            }
            return body.result;
          }
          const scripts = await get('/accounts/' + account + '/workers/scripts', 'Workers Scripts Read');
          const queues = await get('/accounts/' + account + '/queues', 'Queues Read');
          if (process.env.OWNER_CONFIRMED_WORKERS_FREE !== 'true') {
            console.log('FAIL | Workers Free plan owner-confirmation marker missing');
            process.exit(1);
          }
          console.log('PASS | Workers Free plan owner-confirmed; Billing API not queried');

          const subdomain = await get('/accounts/' + account + '/workers/subdomain', 'Workers Scripts Read');
          const workerName = 'atlas-data-cleaning-trial';
          const queueName = 'atlas-data-cleaning-trial-queue';
          const namespaces = await get('/accounts/' + account + '/workers/durable_objects/namespaces?per_page=1000', 'Workers Scripts Read');
          if ((namespaces || []).some(x => x.script === workerName)) {
            console.log('FAIL | trial Durable Object namespace already exists; refusing to reuse');
            process.exit(1);
          }
          if ((scripts || []).some(x => [x.id, x.name, x.script_name].includes(workerName))) {
            console.log('FAIL | trial Worker name already exists; refusing to overwrite');
            process.exit(1);
          }
          if ((queues || []).some(x => x.queue_name === queueName)) {
            console.log('FAIL | trial Queue name already exists; refusing to reuse an unverified resource');
            process.exit(1);
          }
          if (!subdomain?.subdomain) {
            console.log('FAIL | Workers Scripts Read (workers.dev subdomain unavailable)');
            process.exit(1);
          }
          const url = 'https://' + workerName + '.' + subdomain.subdomain + '.workers.dev';
          await import('node:fs').then(({appendFileSync}) => appendFileSync(process.env.GITHUB_ENV, 'TRIAL_BASE_URL=' + url + '\n'));
          await import('node:fs').then(({appendFileSync}) => appendFileSync(process.env.GITHUB_OUTPUT, 'url=' + url + '\n'));
          console.log('PASS | exact trial resource names are unused; workers.dev hostname resolved');
          console.log('TRIAL_BASE_URL=' + url);
          NODE

      - name: Create dedicated trial Queue
        id: queue
        if: steps.gate.outputs.armed == 'true'
        env:
          CF_TRIAL_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CF_ACCOUNT_ID: c46718094ced1f5f75492f4c67c7d390
        shell: bash
        run: |
          set +x
          node --input-type=module <<'NODE'
          const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + process.env.CF_ACCOUNT_ID + '/queues', {
            method: 'POST',
            headers: { authorization: 'Bearer ' + process.env.CF_TRIAL_API_TOKEN, 'content-type': 'application/json' },
            body: JSON.stringify({ queue_name: 'atlas-data-cleaning-trial-queue' }),
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok || body.success !== true || !body.result?.queue_id && !body.result?.id) {
            console.log('FAIL | ' + (response.status === 403 ? 'Queues Write' : 'trial Queue creation (HTTP ' + response.status + ')'));
            process.exit(1);
          }
          const id = body.result.queue_id || body.result.id;
          await import('node:fs').then(({appendFileSync}) => appendFileSync(process.env.GITHUB_OUTPUT, 'queue_id=' + id + '\n'));
          await import('node:fs').then(({appendFileSync}) => appendFileSync(process.env.GITHUB_ENV, 'TRIAL_QUEUE_ID=' + id + '\n'));
          console.log('PASS | dedicated trial Queue created');
          NODE

      - name: Deploy isolated Worker and its Durable Object namespaces
        if: steps.gate.outputs.armed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c46718094ced1f5f75492f4c67c7d390
        shell: bash
        run: |
          set +x
          set +e
          npx --yes wrangler@4 deploy --config wrangler.data-cleaning-trial.toml >/tmp/atlas-trial-deploy.log 2>&1
          deploy_status=$?
          set -e

          if ! node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { redactWranglerOutput } from './ops/scripts/redact-wrangler-output.mjs';
          const raw = readFileSync('/tmp/atlas-trial-deploy.log', 'utf8');
          const safe = redactWranglerOutput(raw, [
            process.env.CLOUDFLARE_API_TOKEN,
            process.env.CLOUDFLARE_ACCOUNT_ID,
          ]);
          console.log('----- sanitized full Wrangler deploy output -----');
          process.stdout.write(safe.endsWith('\n') ? safe : safe + '\n');
          console.log('----- end sanitized Wrangler deploy output -----');
          NODE
          then
            echo "FAIL | Wrangler output sanitizer failed; raw output withheld"
            exit 1
          fi

          if [ "$deploy_status" -eq 0 ]; then
            echo "PASS | isolated Worker deployed with trial-only Queue and Durable Objects"
          else
            echo "FAIL | Wrangler deploy exited with status $deploy_status; see sanitized full output above"
            exit "$deploy_status"
          fi


      - name: Verify trial Durable Object namespaces before synthetic measurement
        if: steps.gate.outputs.armed == 'true'
        env:
          CF_TRIAL_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CF_ACCOUNT_ID: c46718094ced1f5f75492f4c67c7d390
        shell: bash
        run: |
          set +x
          node --input-type=module <<'NODE'
          const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + process.env.CF_ACCOUNT_ID + '/workers/durable_objects/namespaces?per_page=1000', {
            headers: { authorization: 'Bearer ' + process.env.CF_TRIAL_API_TOKEN },
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok || body.success !== true) {
            console.log('FAIL | Workers Scripts Read (trial Durable Object namespace verification)');
            process.exit(1);
          }
          const namespaces = (body.result || []).filter(x => x.script === 'atlas-data-cleaning-trial');
          const jobState = namespaces.find(x => x.class === 'JobState');
          const rateLimitState = namespaces.find(x => x.class === 'RateLimitState');
          if (!jobState?.id || !rateLimitState?.id) {
            console.log('FAIL | trial Durable Object namespace missing: ' + [
              !jobState?.id ? 'JobState' : '',
              !rateLimitState?.id ? 'RateLimitState' : '',
            ].filter(Boolean).join(', '));
            process.exit(1);
          }
          const { appendFileSync } = await import('node:fs');
          appendFileSync(process.env.GITHUB_ENV, 'TRIAL_JOB_STATE_NAMESPACE_ID=' + jobState.id + '\n');
          appendFileSync(process.env.GITHUB_ENV, 'TRIAL_RATE_LIMIT_NAMESPACE_ID=' + rateLimitState.id + '\n');
          console.log('PASS | trial JobState and RateLimitState namespaces confirmed');
          NODE
      - name: Provision CLEANING_API_TOKEN as a Worker secret
        if: steps.gate.outputs.armed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c46718094ced1f5f75492f4c67c7d390
          CLEANING_API_TOKEN: ${{ secrets.CLEANING_API_TOKEN }}
        shell: bash
        run: |
          set +x
          if printf '%s' "$CLEANING_API_TOKEN" | npx --yes wrangler@4 secret put CLEANING_API_TOKEN --config wrangler.data-cleaning-trial.toml >/dev/null 2>&1; then
            echo "PASS | CLEANING_API_TOKEN provisioned as Worker secret; value not displayed"
          else
            echo "FAIL | Workers Admin / Workers Scripts Write (Worker secret provisioning)"
            exit 1
          fi

      - name: Preflight CLEANING_API_TOKEN length before synthetic upload
        if: steps.gate.outputs.armed == 'true'
        env:
          CLEANING_API_TOKEN: ${{ secrets.CLEANING_API_TOKEN }}
        shell: bash
        run: |
          set +x
          if [ "${#CLEANING_API_TOKEN}" -ge 32 ]; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi

      - name: Run synthetic 10,000-row and 2,000-row measurements
        id: measurement
        if: steps.gate.outputs.armed == 'true'
        env:
          CLEANING_API_TOKEN: ${{ secrets.CLEANING_API_TOKEN }}
        shell: bash
        run: |
          set +x
          node --input-type=module <<'NODE'
          const base = process.env.TRIAL_BASE_URL;
          const token = process.env.CLEANING_API_TOKEN;
          if (!base || !token) throw new Error('trial endpoint or client secret missing');
          const auth = { authorization: 'Bearer ' + token };
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const percentile = (values, p) => {
            const sorted = [...values].sort((a, b) => a - b);
            return sorted[Math.max(0, Math.ceil(sorted.length * p) - 1)] ?? null;
          };
          function redactDiagnosticText(value, knownSecrets = []) {
            let output = String(value ?? '');
            for (const secret of knownSecrets) {
              if (typeof secret === 'string' && secret.length >= 8) output = output.split(secret).join('[REDACTED]');
            }
            return output
              .replace(/\bBearer\s+[A-Za-z0-9._~+/-]{16,512}\b/gi, 'Bearer [REDACTED]')
              .replace(/\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b/g, '[REDACTED_JWT]')
              .replace(/\b[a-f0-9]{32}\b/gi, '[REDACTED_ID_OR_TOKEN]')
              .replace(/("(?:[^"]*(?:token|secret|password|authorization|account|customer|email|phone|address|name|payload|content|data|file|csv|input|output)[^"]*)"\s*:\s*")(?:(?:\\.|[^"\\])*)"/gi, '$1[REDACTED]')
              .replace(/\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b/gi, '[REDACTED_EMAIL]')
              .replace(/\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b/gi, '[REDACTED_UUID]');
          }
          async function measure(rowCount, chunkRows) {
            const rows = ['id,name,value'];
            for (let i = 1; i <= rowCount; i++) rows.push(i + ',Synthetic_' + i + ',' + (i % 97));
            const csv = rows.join('\n') + '\n';
            const options = { inputFormat: 'csv', outputFormat: 'json', delimiter: ',', chunkRows, operations: [{ type: 'convert_format', to: 'json' }] };
            const started = performance.now();
            const submissionStarted = performance.now();
            let requests = 1;
            let created;
            let job;
            try {
              created = await fetch(base + '/v1/jobs', {
                method: 'POST',
                headers: { ...auth, 'content-type': 'text/csv; charset=utf-8', 'x-atlas-cleaning-options': JSON.stringify(options) },
                body: csv,
              });
              if (created.status !== 202) {
                const safeSecrets = [token];
                console.error('UPLOAD_RESPONSE | status=' + created.status + ' statusText=' + redactDiagnosticText(created.statusText, safeSecrets));
                console.error('UPLOAD_HEADERS | cf-ray=' + redactDiagnosticText(created.headers.get('cf-ray') || '', safeSecrets) + ' content-type=' + redactDiagnosticText(created.headers.get('content-type') || '', safeSecrets));
                const responseBody = await created.text();
                let parsedBody;
                try { parsedBody = JSON.parse(responseBody); } catch {}
                if (parsedBody && typeof parsedBody === 'object') {
                  for (const key of ['error', 'code']) {
                    if (Object.prototype.hasOwnProperty.call(parsedBody, key)) {
                      console.error('UPLOAD_ERROR_FIELD | ' + key + '=' + redactDiagnosticText(JSON.stringify(parsedBody[key]), safeSecrets));
                    }
                  }
                }
                console.error('UPLOAD_BODY_REDACTED | ' + redactDiagnosticText(responseBody, safeSecrets));
                throw new Error('synthetic upload rejected: HTTP ' + created.status);
              }
              job = await created.json();
            } catch (error) {
              console.error('UPLOAD_EXCEPTION_STACK | ' + redactDiagnosticText(error?.stack || String(error), [token]));
              throw new Error(redactDiagnosticText(error?.message || 'synthetic upload failed', [token]));
            }
            let state;
            let submissionToReadyObservedMs = null;
            for (let attempt = 0; attempt < 180; attempt++) {
              await sleep(500);
              const response = await fetch(base + '/v1/jobs/' + job.jobId + '/status', { headers: auth });
              requests++;
              if (!response.ok) throw new Error('status request failed: HTTP ' + response.status);
              state = await response.json();
              if (state.status === 'complete' || state.status === 'failed') {
                submissionToReadyObservedMs = Number((performance.now() - submissionStarted).toFixed(3));
                break;
              }
            }
            if (state?.status !== 'complete') throw new Error('synthetic job did not complete: ' + (state?.errorCode || state?.status || 'timeout'));
            if (state.inputRowCount !== rowCount || state.outputRowCount !== rowCount) {
              throw new Error('row-count mismatch: input=' + state.inputRowCount + ' output=' + state.outputRowCount);
            }
            const result = await fetch(base + '/v1/jobs/' + job.jobId + '/result', { headers: auth });
            requests++;
            if (result.status !== 200 || result.headers.get('x-atlas-temporary-job-deleted') !== 'true') {
              throw new Error('result delivery or temporary-state deletion failed: HTTP ' + result.status);
            }
            const output = await result.text();
            if (!output.length) throw new Error('empty synthetic output');
            const elapsedMs = Number((performance.now() - started).toFixed(3));
            const chunks = (state.chunkMetrics || []).map(x => Number(x.computeMs)).filter(Number.isFinite);
            const resultStats = {
              rows: rowCount,
              inputBytes: Buffer.byteLength(csv),
              chunkRows,
              totalProcessingSlices: state.processingChunkCount ?? chunks.length,
              chunkComputeMs: { p50: percentile(chunks, .50), p95: percentile(chunks, .95), max: chunks.length ? Math.max(...chunks) : null },
              submissionToReadyObservedMs,
              resultDeliveryEndToEndMs: elapsedMs,
              httpRequests: requests,
              queueMessagesSubmitted: job.chunks ?? null,
              outputBytes: Buffer.byteLength(output),
            };
            console.log('MEASURED | ' + JSON.stringify(resultStats));
            return resultStats;
          }
          const startedIso = new Date().toISOString();
          const chunkRows = 250;
          const results = [await measure(10000, chunkRows), await measure(2000, chunkRows)];
          const endedIso = new Date().toISOString();
          const data = { startedIso, endedIso, initialChunkRows: 250, finalChunkRows: chunkRows, remeasured: false, results };
          await import('node:fs').then(({appendFileSync}) => appendFileSync(process.env.GITHUB_OUTPUT, 'measurement_json=' + JSON.stringify(data) + '\n'));
          await import('node:fs').then(({appendFileSync}) => appendFileSync(process.env.GITHUB_ENV, 'TRIAL_WINDOW_START=' + startedIso + '\nTRIAL_WINDOW_END=' + endedIso + '\nTRIAL_FINAL_CHUNK_ROWS=' + chunkRows + '\n'));
          await import('node:fs').then(({appendFileSync}) => appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Synthetic data-cleaning measurements',
            '',
            '| Rows | Input bytes | Chunk rows | Processing slices | Queue messages | Chunk compute P50/P95/max (ms; elapsed-time proxy) | Submission-to-ready observed (ms) | Result-delivery end-to-end (ms) | HTTP requests |',
            '|---:|---:|---:|---:|---:|---:|---:|---:|---:|',
            ...results.map(x => '| ' + x.rows + ' | ' + x.inputBytes + ' | ' + x.chunkRows + ' | ' + x.totalProcessingSlices + ' | ' + x.queueMessagesSubmitted + ' | ' + [x.chunkComputeMs.p50,x.chunkComputeMs.p95,x.chunkComputeMs.max].join(' / ') + ' | ' + x.submissionToReadyObservedMs + ' | ' + x.resultDeliveryEndToEndMs + ' | ' + x.httpRequests + ' |'),
            '',
            'Chunk compute is a synchronous elapsed-time proxy from the Worker; it is not Cloudflare billed CPU time.',
            results.some(x => x.chunkComputeMs.max !== null && x.chunkComputeMs.max > 10)
              ? 'At least one chunk compute sample exceeded 10 ms; no automatic remeasurement was performed.'
              : 'No chunk compute sample exceeded 10 ms; no automatic remeasurement was performed.',
            '',
          ].join('\n') + '\n'));
          console.log('TRIAL_WINDOW_START=' + startedIso);
          console.log('TRIAL_WINDOW_END=' + endedIso);
          NODE

      - name: Read Cloudflare Worker, Durable Object, and Queue analytics
        if: steps.gate.outputs.armed == 'true'
        env:
          CF_TRIAL_API_TOKEN: ${{ secrets.CF_TRIAL_API_TOKEN }}
          CF_ACCOUNT_ID: c46718094ced1f5f75492f4c67c7d390
        shell: bash
        run: |
          set +x
          node --input-type=module <<'NODE'
          const token = process.env.CF_TRIAL_API_TOKEN;
          const account = process.env.CF_ACCOUNT_ID;
          const start = process.env.TRIAL_WINDOW_START;
          const end = process.env.TRIAL_WINDOW_END;
          const queueId = process.env.TRIAL_QUEUE_ID;
          const api = 'https://api.cloudflare.com/client/v4/graphql';
          async function gql(query) {
            const response = await fetch(api, {
              method: 'POST',
              headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const json = await response.json().catch(() => ({}));
            if (!response.ok || json.errors?.length) throw new Error('GraphQL analytics unavailable');
            return json.data?.viewer?.accounts?.[0] ?? {};
          }
          const qTime = value => value.replace(/"/g, '');
          const accounts = 'accounts(filter:{accountTag:"' + account + '"})';
          const script = 'atlas-data-cleaning-trial';
          const timestampFilter = 'datetime_geq:"' + qTime(start) + '",datetime_leq:"' + qTime(end) + '"';
          const namespaceIds = [
            process.env.TRIAL_JOB_STATE_NAMESPACE_ID,
            process.env.TRIAL_RATE_LIMIT_NAMESPACE_ID,
          ].filter(Boolean);
          if (namespaceIds.length !== 2) {
            throw new Error('trial Durable Object namespace IDs missing; refusing to report incomplete analytics');
          }
          const namespaceList = '[' + namespaceIds.map(id => '"' + id.replace(/"/g, '') + '"').join(',') + ']';

          let workerMetrics = null;
          try {
            const workerQuery = `{ viewer { ${accounts} {
              workersInvocationsAdaptive(limit:10000,filter:{scriptName:"${script}",${timestampFilter}}) {
                sum { requests errors subrequests cpuTimeUs }
                quantiles { cpuTimeP50 cpuTimeP95 cpuTimeP99 }
                max { cpuTime }
              }
            } } }`;
            const result = await gql(workerQuery);
            workerMetrics = result.workersInvocationsAdaptive?.[0] ?? null;
          } catch {
            console.log('WORKER_CPU_METRICS_UNAVAILABLE | no Cloudflare Worker CPU values estimated');
          }

          let doMetrics = null;
          try {
            const doQuery = `{ viewer { ${accounts} {
              durableObjectsInvocationsAdaptiveGroups(limit:10000,filter:{namespaceId_in:${namespaceList},${timestampFilter}}) {
                sum { requests errors }
                quantiles { cpuTimeP50 cpuTimeP95 cpuTimeP99 }
              }
            } } }`;
            const result = await gql(doQuery);
            doMetrics = result.durableObjectsInvocationsAdaptiveGroups ?? [];
          } catch {
            console.log('DURABLE_OBJECT_INVOCATION_METRICS_UNAVAILABLE | no DO invocation values estimated');
          }

          let doPeriodic = null;
          try {
            const periodicQuery = `{ viewer { ${accounts} {
              durableObjectsPeriodicGroups(limit:10000,filter:{namespaceId_in:${namespaceList},${timestampFilter}}) {
                count
                sum { cpuTime exceededCpuErrors }
                dimensions { namespaceId datetime }
              }
            } } }`;
            const result = await gql(periodicQuery);
            doPeriodic = result.durableObjectsPeriodicGroups ?? [];
          } catch {
            console.log('DURABLE_OBJECT_PERIODIC_CPU_UNAVAILABLE | no DO periodic CPU value estimated');
          }

          let queueGroups = null;
          try {
            const queueQuery = `{ viewer { ${accounts} {
              queueMessageOperationsAdaptiveGroups(limit:10000,filter:{queueId:"${queueId}",${timestampFilter}}) {
                count
                sum { billableOperations bytes }
                dimensions { actionType consumerType outcome }
              }
            } } }`;
            const result = await gql(queueQuery);
            queueGroups = result.queueMessageOperationsAdaptiveGroups ?? [];
          } catch {
            console.log('QUEUE_METRICS_UNAVAILABLE | Queue analytics query was not accepted or data is not yet available');
          }

          if (workerMetrics) {
            const sum = workerMetrics.sum || {};
            const q = workerMetrics.quantiles || {};
            console.log('WORKER_ANALYTICS | ' + JSON.stringify({
              requests: sum.requests ?? null,
              errors: sum.errors ?? null,
              subrequests: sum.subrequests ?? null,
              cpuTimeSumMicroseconds: sum.cpuTimeUs ?? null,
              cpuTimeP50Microseconds: q.cpuTimeP50 ?? null,
              cpuTimeP95Microseconds: q.cpuTimeP95 ?? null,
              cpuTimeP99Microseconds: q.cpuTimeP99 ?? null,
              cpuTimeMaxMicroseconds: workerMetrics.max?.cpuTime ?? null,
              cpuTimeScope: 'front-end Worker invocations; not per processing slice',
            }));
          }
          if (doMetrics) {
            const total = doMetrics.reduce((acc, x) => acc + Number(x.sum?.requests || 0), 0);
            const groups = doMetrics.map(x => ({
              requests:x.sum?.requests ?? null,
              errors:x.sum?.errors ?? null,
              cpuP50Microseconds:x.quantiles?.cpuTimeP50 ?? null,
              cpuP95Microseconds:x.quantiles?.cpuTimeP95 ?? null,
              cpuP99Microseconds:x.quantiles?.cpuTimeP99 ?? null,
              cpuMaxMicroseconds:null,
            }));
            console.log('DURABLE_OBJECT_ANALYTICS | ' + JSON.stringify({
              requests:total,
              groups,
              cpuMax: 'unavailable in this Cloudflare Durable Object dataset',
              scope: 'Durable Object invocations across JobState and RateLimitState, not individual processing slices',
            }));
          }
          if (doPeriodic) {
            console.log('DURABLE_OBJECT_PERIODIC_CPU | ' + JSON.stringify(doPeriodic.map(x => ({
              namespaceId:x.dimensions?.namespaceId ?? null,
              datetime:x.dimensions?.datetime ?? null,
              cpuTimeMicroseconds:x.sum?.cpuTime ?? null,
              exceededCpuErrors:x.sum?.exceededCpuErrors ?? null,
            }))));
          }
          if (queueGroups) {
            const operations = queueGroups.reduce((acc, x) => acc + Number(x.sum?.billableOperations || 0), 0);
            const breakdown = queueGroups.map(x => ({count:x.count ?? null,billableOperations:x.sum?.billableOperations ?? null,actionType:x.dimensions?.actionType ?? null,consumerType:x.dimensions?.consumerType ?? null,outcome:x.dimensions?.outcome ?? null}));
            console.log('QUEUE_ANALYTICS | ' + JSON.stringify({billableOperations:operations,breakdown}));
          }
          await import('node:fs').then(({appendFileSync}) => appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '',
            '## Cloudflare analytics',
            '',
            workerMetrics ? 'Worker CPU quantiles and maximum are for front-end Worker invocations, not per processing chunk.' : 'Cloudflare front-end Worker CPU metrics: unavailable; no value estimated.',
            doMetrics?.length ? 'Durable Object CPU quantiles are per DO invocation; the dataset does not expose DO max CPU. These are not per processing chunk.' : 'Durable Object invocation CPU metrics: unavailable or not ingested in the query window.',
            doPeriodic?.length ? 'Durable Object periodic CPU totals by trial namespace and time bucket are in the job log.' : 'Durable Object periodic CPU totals: unavailable or not ingested in the query window.',
            queueGroups?.length ? 'Queue billable operation aggregates returned by Cloudflare GraphQL are in the job log.' : 'Queue operation aggregates: unavailable or not ingested in the query window.',
            '',
          ].join('\n') + '\n'));
          NODE
