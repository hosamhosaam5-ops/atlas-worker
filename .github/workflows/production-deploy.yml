name: ATLAS Production Deploy

# Production deployments require an explicit founder-triggered workflow run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-worker-production
  cancel-in-progress: false

jobs:
  test:
    name: Test before production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete test suite
        run: npm test

  deploy:
    name: Deploy tested commit to Cloudflare
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked project dependencies
        run: npm ci --no-audit --no-fund
      - name: Fail closed if deployment token is not configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
      - name: Deploy exact tested SHA using the project's locked Wrangler v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c46718094ced1f5f75492f4c67c7d390
        run: |
          set -euo pipefail
          test -n "$GITHUB_SHA"
          npx --no-install wrangler deploy --var "ATLAS_GIT_SHA:$GITHUB_SHA"

      - name: Verify deployed source SHA and health
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 10 https://atlas-worker.hosamhosaam5.workers.dev/health -o health.json; then
              cat health.json
              ACTUAL_SHA="$(jq -r '.git_sha // ""' health.json)"
              if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ] && jq -e '.ok == true and .db == "ok"' health.json >/dev/null; then
                echo "DEPLOYED_SOURCE_SHA=$ACTUAL_SHA"
                exit 0
              fi
              echo "Waiting for Worker propagation: expected=$EXPECTED_SHA actual=${ACTUAL_SHA:-missing} attempt=$attempt"
            else
              echo "Health request failed attempt=$attempt"
            fi
            sleep 2
          done
          echo "SOURCE_SHA_VERIFICATION_FAILED expected=$EXPECTED_SHA"
          exit 1
