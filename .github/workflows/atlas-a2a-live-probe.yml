name: ATLAS A2A live interoperability probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/atlas-a2a-live-probe.yml

jobs:
  a2a-live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production health, Agent Card, and A2A POST
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://atlas-worker.hosamhosaam5.workers.dev"

          echo "== health =="
          curl --fail --silent --show-error --max-time 20 "$BASE/health" | tee /tmp/health.json
          echo

          echo "== agent card =="
          curl --fail --silent --show-error --max-time 20 "$BASE/.well-known/agent-card.json" | tee /tmp/card.json
          echo

          ENDPOINT="$(jq -r '.supportedInterfaces[0].url // empty' /tmp/card.json)"
          test -n "$ENDPOINT"
          test "$ENDPOINT" = "$BASE/a2a"

          PROBE_ID="atlas-live-probe-${GITHUB_RUN_ID}"
          MESSAGE_ID="atlas-live-message-${GITHUB_RUN_ID}"
          jq -n --arg id "$PROBE_ID" --arg mid "$MESSAGE_ID" '{
            jsonrpc:"2.0",
            id:$id,
            method:"message/send",
            params:{
              message:{
                role:"user",
                messageId:$mid,
                parts:[{
                  kind:"text",
                  text:"ATLAS interoperability probe only. Reply with a short confirmation. Do not create orders, payments, purchases, external commitments, or modify customer data."
                }]
              },
              configuration:{
                acceptedOutputModes:["text/plain"],
                blocking:true
              },
              metadata:{
                probe:true,
                purpose:"production_a2a_interoperability_test",
                no_commerce:true
              }
            }
          }' > /tmp/a2a-request.json

          echo "== external A2A POST =="
          STATUS="$(curl --silent --show-error --max-time 60 -o /tmp/a2a-response.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H 'accept: application/json' \
            --data-binary @/tmp/a2a-request.json \
            "$ENDPOINT")"

          echo "HTTP $STATUS"
          cat /tmp/a2a-response.json
          echo

          test "$STATUS" = "200"
          jq -e --arg id "$PROBE_ID" '
            .jsonrpc == "2.0" and
            .id == $id and
            (.result != null) and
            (.error == null)
          ' /tmp/a2a-response.json >/dev/null

          echo "A2A production POST: PASS"
