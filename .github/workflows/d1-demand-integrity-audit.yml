name: ATLAS D1 demand integrity audit

on:
  push:
    branches: [main]
    paths:
      - 'ops/triggers/demand-integrity-audit.trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-d1-demand-integrity-audit
  cancel-in-progress: false

jobs:
  aggregate-read-only-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked Wrangler dependency
        run: npm ci --no-audit --no-fund

      - name: Validate audit helper syntax
        run: node --check ops/scripts/d1-demand-integrity-audit.mjs

      - name: Print aggregate-only production integrity counts
        run: node ops/scripts/d1-demand-integrity-audit.mjs
