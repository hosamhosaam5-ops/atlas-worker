name: ATLAS D1 apply migration 0008

on:
  push:
    branches: [main]
    paths:
      - 'ops/triggers/apply-0008.trigger'
  pull_request:
    paths:
      - '.github/workflows/d1-apply-0008.yml'
      - 'ops/scripts/d1-apply-0008.mjs'
      - 'ops/triggers/apply-0008.trigger'
      - 'migrations/0008_demand_scan_breaker_observability.sql'
      - 'test/d1-apply-0008-static.test.mjs'
      - 'test/source-circuit-breaker.test.mjs'
      - 'src/autonomy/engine.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-d1-apply-0008
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull-request commit
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate guarded helper syntax
        run: node --check ops/scripts/d1-apply-0008.mjs
      - name: Test migration against pre-0008 SQLite snapshot
        run: node --test test/d1-apply-0008-static.test.mjs
      - name: Test breaker state persistence in scan rows
        run: node --test test/source-circuit-breaker.test.mjs

  apply-0008:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact approved trigger commit
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked Wrangler dependency
        run: npm ci --no-audit --no-fund
      - name: Validate guarded helper syntax
        run: node --check ops/scripts/d1-apply-0008.mjs
      - name: Read-only production preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node ops/scripts/d1-apply-0008.mjs preflight
      - name: Capture one fresh production D1 bookmark
        id: restore_point
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node ops/scripts/d1-apply-0008.mjs capture
      - name: Require same-run bookmark younger than two hours
        env:
          D1_BOOKMARK: ${{ steps.restore_point.outputs.d1_bookmark }}
          D1_BOOKMARK_CAPTURED_AT_MS: ${{ steps.restore_point.outputs.d1_bookmark_captured_at_ms }}
          D1_BOOKMARK_RUN_ID: ${{ steps.restore_point.outputs.d1_bookmark_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node ops/scripts/d1-apply-0008.mjs guard
      - name: Re-check bookmark immediately before the allowlisted write
        env:
          D1_BOOKMARK: ${{ steps.restore_point.outputs.d1_bookmark }}
          D1_BOOKMARK_CAPTURED_AT_MS: ${{ steps.restore_point.outputs.d1_bookmark_captured_at_ms }}
          D1_BOOKMARK_RUN_ID: ${{ steps.restore_point.outputs.d1_bookmark_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node ops/scripts/d1-apply-0008.mjs guard
      - name: Execute exactly migrations/0008_demand_scan_breaker_observability.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          SQL_FILE='migrations/0008_demand_scan_breaker_observability.sql'
          ALLOWED_SQL_FILE='migrations/0008_demand_scan_breaker_observability.sql'
          if [ "$SQL_FILE" != "$ALLOWED_SQL_FILE" ]; then
            echo "::error::SQL file is not on the explicit 0008 allowlist."
            exit 1
          fi
          test -s "$SQL_FILE"
          SQL_SHA256="$(sha256sum "$SQL_FILE" | cut -d ' ' -f1)"
          echo "Allowlisted SQL SHA-256: $SQL_SHA256"
          npx --no-install wrangler d1 execute atlas_db --remote --file="$SQL_FILE"
          echo "Executed only $SQL_FILE"
      - name: Verify three nullable columns and preserve existing data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node ops/scripts/d1-apply-0008.mjs verify
      - name: Remove ephemeral aggregate baseline
        if: always()
        shell: bash
        run: rm -f .d1-0008-preflight.json
