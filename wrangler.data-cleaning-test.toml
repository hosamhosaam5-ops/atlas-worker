name = "atlas-data-cleaning-ci-local"
main = "src/data-cleaning/worker.js"
compatibility_date = "2026-10-26"
workers_dev = false
preview_urls = false

[vars]
TEST_MODE = "1"

[[durable_objects.bindings]]
name = "JOB_STATE"
class_name = "JobState"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "JobState" ]

[[queues.producers]]
queue = "atlas-data-cleaning-ci-local"
binding = "ATLAS_CLEANING_QUEUE"

[[queues.consumers]]
queue = "atlas-data-cleaning-ci-local"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 1
