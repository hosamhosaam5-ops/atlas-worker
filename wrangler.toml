name = "atlas-worker"
main = "src/index.ts"
compatibility_date = "2026-09-27"
compatibility_flags = ["global_fetch_strictly_public"]

# M6A deployment configuration. A database ID is configured, but account ownership,
# migrations, secrets, and deployment status must be verified separately.

[[d1_databases]]
binding = "DB"
database_name = "atlas_db"
database_id = "a5a75faa-e800-4112-b67a-3c53d7b0d8d4"

[ai]
binding = "AI"

# R2 binding is only needed when FILE_STORAGE=R2. Declared now, harmless unused.
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "atlas-order-files"

# Cron schedules are configured here; they run only after this Worker is deployed.
[triggers]
crons = [
  "0 21 * * *",    # Daily CEO Report (00:00 Asia/Riyadh)
  "*/30 * * * *",  # Smart Revenue Watch (every 30 min)
  "*/15 * * * *",  # Telegraph Monitor (every 15 min)
  "*/5 * * * *",   # Safe Telegram event recovery (PENDING -> terminal)
]

[vars]
# M5/M6A defaults — Telegram is LIVE in production; other external providers remain MOCK; switching any to LIVE is
# founder decision and requires its secret (never stored here).
AI_PROVIDER = "ROUTER"
AI_MODEL = "@cf/zai-org/glm-4.7-flash"
BRAVE = "TAVILY"
TELEGRAM_PROVIDER = "LIVE"
EMAIL_PROVIDER = "MOCK"
PAYMENT_PROVIDER = "BASE_RPC"
FILE_STORAGE = "LOCAL"
DATAPOINT_PROVIDER = "MOCK"
BOUNTYBOOK_PROVIDER = "MOCK"
# FOUNDER_CHAT_ID is a var (not secret) — set at deploy:
FOUNDER_CHAT_ID = "5246182877"
FOUNDER_OAUTH_SUB = "d11ad887-43fa-51fb-95f2-dee77ccdd3e2"
# Founder-approved public receiving wallet for x402. This is a public address, not a private key.
ATLAS_WALLET_ADDRESS = "0x59Ea688b36464133E71873d8BeE8Fcb3BC369383"

# Secrets (founder enters via `wrangler secret put`, never in this file):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, OPENROUTER_API_KEY,
#   BRAVE_API_KEY, TAVILY_API_KEY, RESEND_API_KEY, CHATGPT_BRIDGE_SECRET

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "096e1625b3114787aa89cb8a45b65a8a"

# Production error monitoring; enabled for new traffic after deploy.
[observability.issues]
enabled = true
